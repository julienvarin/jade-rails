<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jade Rails Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Playful skin: chunky candy buttons, glossy cards, bouncy motion. Game logic is identical to jade-rails.html. */
:root{--bg:#7c5cff;--panel:#fff;--ink:#2b1d52;--muted:#8a7fb0;--line:#ece6ff;--accent:#ff4fa3;--accent-d:#d62f84;--go:#2ed47a;--go-d:#1fa45d;--sun:#ffc93c;--sun-d:#e09b00}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:500 15px/1.4 Fredoka,"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  background:radial-gradient(circle at 20% 15%,#ffffff22 0 2px,transparent 3px) 0 0/34px 34px,radial-gradient(circle at 70% 60%,#ffffff18 0 3px,transparent 4px) 0 0/52px 52px,linear-gradient(160deg,#8f6bff,#5b3fd9 55%,#ff6fb5);background-attachment:fixed}
.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:14px;height:100vh}
.main{display:flex;flex-direction:column;gap:14px;min-height:0}
.mapbox{flex:1;min-height:0;background:#bfe6ff;border-radius:28px;overflow:hidden;position:relative;border:6px solid #fff;box-shadow:0 8px 0 #3d2aa0,0 18px 40px #2a1a7a66}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.zoomctl button{width:44px;height:44px;padding:0;background:#fff;color:var(--ink);font-size:22px;border-radius:50%;box-shadow:0 4px 0 #c9bdf5}
.zoomctl button:active{transform:translateY(3px);box-shadow:0 1px 0 #c9bdf5}
#fx{pointer-events:none}
.fx-glow{stroke-linecap:round;opacity:0;animation:glow 1.2s ease-out}
@keyframes glow{0%{opacity:.9;stroke-width:8}100%{opacity:0;stroke-width:40}}
.fx-pts{font:700 30px Fredoka,system-ui,sans-serif;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;animation:rise 1.6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes rise{0%{transform:translateY(6px) scale(.2);opacity:0}20%{transform:translateY(-6px) scale(1.3);opacity:1}35%{transform:translateY(-10px) scale(1)}100%{transform:translateY(-44px) scale(1);opacity:0}}
.fx-word{font:700 34px Fredoka,system-ui,sans-serif;text-anchor:middle;fill:#ffc93c;paint-order:stroke;stroke:#7a2a9e;stroke-width:8px;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;animation:word 1.5s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes word{0%{transform:scale(0) rotate(-12deg);opacity:0}25%{transform:scale(1.25) rotate(4deg);opacity:1}40%{transform:scale(1) rotate(-2deg)}80%{opacity:1}100%{transform:scale(1.1) translateY(-20px);opacity:0}}
.fx-pop{transform-box:fill-box;transform-origin:center;animation:popb .8s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes popb{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.fx-path{stroke-width:11;stroke-linecap:round;stroke-dasharray:14 10;filter:drop-shadow(0 0 6px #ff4fa3);animation:march .6s linear infinite,fadeout 3.4s ease-in forwards}
@keyframes march{to{stroke-dashoffset:-24}}
@keyframes fadeout{0%,75%{opacity:.95}100%{opacity:0}}
.fx-ring{fill:none;stroke:#ff4fa3;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:ring 1.3s ease-out 2 both}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(4.5);opacity:0}}
.banner{position:fixed;left:50%;top:16%;background:linear-gradient(#fff,#fff3fb);border-radius:28px;padding:18px 36px;text-align:center;border:5px solid #ffc93c;box-shadow:0 8px 0 #e09b00,0 20px 50px #2a1a7a88;z-index:30;pointer-events:none;animation:pop 3.4s ease forwards}
.banner .bt{font-weight:700;font-size:24px;color:#ff4fa3}
.banner b{display:block;font-size:42px;color:var(--go);text-shadow:0 3px 0 var(--go-d)}
.banner i{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;animation:conf 1.3s ease-out forwards}
.banner i:nth-child(3n){border-radius:3px;width:8px;height:14px}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes pop{0%{transform:translate(-50%,-24px) scale(.3) rotate(-8deg);opacity:0}10%{transform:translate(-50%,0) scale(1.15) rotate(3deg);opacity:1}18%{transform:translate(-50%,0) scale(1) rotate(0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-12px) scale(.9)}}
.statusbar{position:absolute;top:14px;left:14px;background:#fff;border-radius:999px;padding:9px 18px;font-weight:600;box-shadow:0 4px 0 #c9bdf5,0 8px 20px #2a1a7a33;max-width:calc(100% - 28px)}
.statusbar .final{color:#fff;background:#ff5a5a;border-radius:999px;padding:2px 10px;margin-left:8px;animation:wobble 1s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.06)}}
.statusbar .ghost{padding:4px 12px;margin-left:6px}
.side{display:flex;flex-direction:column;gap:14px;min-height:0}
.card{background:var(--panel);border-radius:24px;padding:14px;box-shadow:0 6px 0 #3d2aa0,0 14px 30px #2a1a7a44}
h3{margin:0 0 10px;font-size:17px;font-weight:600;color:var(--ink)}
h2{margin:0 0 6px;font-size:26px;font-weight:700;color:var(--accent)}
.titlebar{display:flex;gap:6px;white-space:nowrap;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:22px}
.titlebar b{font-size:20px;font-weight:700;color:var(--accent)}
.titlebar .ghost{padding:6px 10px}
.player{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;margin-bottom:4px;transition:transform .25s cubic-bezier(.3,1.6,.6,1)}
.player.active{background:color-mix(in srgb,var(--pc) 16%,#fff);box-shadow:inset 0 0 0 3px var(--pc);transform:scale(1.03)}
.dot{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9 0 18%,transparent 22%),var(--pc);flex:none;box-shadow:inset 0 -4px 0 #0003,0 2px 0 #0002}
.player.active .dot{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px) scale(1.08)}}
.pname{flex:1;font-weight:600;min-width:0}
.sub,.stats{font-size:12px;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:auto auto;gap:2px 10px;font-size:14px}
.st{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink)}
.st svg{width:22px;height:16px;flex:none}.st:first-child svg{color:var(--pc);filter:drop-shadow(0 1px 0 #2b1d52)}
.mc{display:inline-grid;place-items:center;width:17px;height:22px;margin:0 3px 0 2px;border-radius:4px;background:#7c5cff;color:#fff;font-size:11px;line-height:1;border:1.5px solid #2b1d52;box-shadow:3px -2px 0 -1px #fff,3px -2px 0 .5px #2b1d52;transform:rotate(-6deg)}
.score{font-weight:700;font-size:18px;min-width:44px;text-align:center;background:var(--sun);color:#6b3d00;border-radius:999px;padding:2px 8px;box-shadow:inset 0 -3px 0 #0002}
.market{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tcard{position:relative;height:64px;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;transition:transform .2s cubic-bezier(.3,1.8,.5,1);box-shadow:inset 0 -6px 0 #0003,inset 0 3px 0 #fff6,0 3px 0 #0002;overflow:hidden}
.tcard::before{content:"";position:absolute;left:10%;top:7%;width:45%;height:24%;border-radius:999px;background:#ffffff59;transform:rotate(-8deg)}
.tcard .ic{width:70%;height:auto;filter:drop-shadow(0 2px 0 #0003);position:relative}
.tcard .n{position:absolute;top:-2px;right:-2px;min-width:24px;height:24px;border-radius:12px;background:#ff4fa3;color:#fff;font-size:13px;line-height:22px;text-align:center;border:2px solid #fff;box-shadow:0 2px 0 #0003}
.tcard .lbl{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:11px;text-shadow:0 1px 0 #0005}
.market .tcard{animation:pulse-in .45s cubic-bezier(.3,1.7,.5,1) both}
.market .tcard:nth-child(2){animation-delay:.04s}.market .tcard:nth-child(3){animation-delay:.08s}.market .tcard:nth-child(4){animation-delay:.12s}.market .tcard:nth-child(5){animation-delay:.16s}.market .tcard:nth-child(6){animation-delay:.2s}
@keyframes pulse-in{from{transform:scale(.6)}to{transform:none}}
.market .tcard:hover{transform:translateY(-4px) scale(1.08) rotate(-2deg)}
.market .tcard:active{transform:scale(.9)}
.tcard.disabled{filter:saturate(.5) brightness(.95);opacity:.55;pointer-events:none}
.tcard.empty{background:#f3efff;box-shadow:inset 0 0 0 3px #e2d9ff;cursor:default}
.tcard.empty::before{display:none}
.c-red{background:radial-gradient(circle at 50% 120%,#c81d3a,#ff4d6d 70%)}.c-orange{background:radial-gradient(circle at 50% 120%,#e8590c,#ff922b 70%)}
.c-yellow{background:radial-gradient(circle at 50% 120%,#f2a900,#ffd43b 70%);color:#7a5200}.c-green{background:radial-gradient(circle at 50% 120%,#1f9d55,#51cf66 70%)}
.c-blue{background:radial-gradient(circle at 50% 120%,#1c64f2,#4dabf7 70%)}.c-purple{background:radial-gradient(circle at 50% 120%,#7b2ff7,#b06cff 70%)}
.c-black{background:radial-gradient(circle at 50% 120%,#1b1530,#4a4266 70%)}.c-white{background:radial-gradient(circle at 50% 120%,#d9d4ea,#fff 70%);color:#6b6390}
.c-wild{background:conic-gradient(from 0deg,#ff4d6d,#ffd43b,#51cf66,#4dabf7,#b06cff,#ff4d6d);animation:spinbg 4s linear infinite}
@keyframes spinbg{to{filter:hue-rotate(360deg)}}
.deck{background:repeating-linear-gradient(45deg,#7c5cff 0 8px,#6a49f0 8px 16px);flex-direction:column;font-size:20px}.deck small{font-size:12px;opacity:.9}
button{font:inherit;font-weight:600;border:0;border-radius:16px;padding:10px 16px;cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translateY(4px)}
button:disabled{opacity:.45;cursor:default}
.primary{background:linear-gradient(#3ee68a,var(--go));color:#fff;font-size:16px;text-shadow:0 2px 0 #0002;box-shadow:0 5px 0 var(--go-d)}
.primary:active:not(:disabled){box-shadow:0 1px 0 var(--go-d)}
.primary:hover:not(:disabled){filter:brightness(1.06)}
.ghost{background:#f1ecff;color:#5b3fd9;box-shadow:0 4px 0 #d6cbff}
.ghost:active:not(:disabled){box-shadow:0 0 0 #d6cbff}
.wide{width:100%}
.logcard{flex:1;min-height:120px;display:flex;flex-direction:column}
.log{flex:1;min-height:0;overflow:auto;font-size:13px;color:var(--muted)}
.log div{padding:4px 8px;margin-bottom:3px;border-radius:10px;background:#f8f5ff}
.log div:first-child{background:#fff3c4;color:#6b3d00;animation:pulse-in .4s cubic-bezier(.3,1.7,.5,1)}
.bottom{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.hand{display:flex;gap:8px;flex-wrap:nowrap;padding-top:4px}
.hand .tcard{flex:1 1 0;min-width:0;max-width:66px;height:82px;cursor:default;overflow:visible}
.hand .tcard:not(.zero):hover{transform:translateY(-6px) rotate(3deg)}
.hand .tcard.zero{opacity:.22;filter:grayscale(.6)}
.tickets{display:flex;gap:8px;flex-wrap:wrap;max-height:128px;overflow:auto;padding:2px}
.ticket{border:3px solid #e2d9ff;border-radius:16px;padding:6px 10px;font-size:13px;background:#fff;cursor:default;display:flex;align-items:center;gap:8px;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.tickets .ticket:hover{transform:scale(1.05) rotate(-1deg)}
.ticket b{margin-left:4px;background:#7c5cff;color:#fff;border-radius:999px;padding:1px 9px;box-shadow:inset 0 -3px 0 #0002}
.ticket .mm{width:58px;height:47px;border-radius:10px;flex:none}
.ticket .tt{flex:1;line-height:1.25;font-weight:600}
.ticket.big .mm{width:96px;height:78px}
.ticket.long{background:linear-gradient(135deg,#fff7d6,#ffe08a);border-color:#ffc93c}
.ticket.long b{background:#ff922b}
.ltag{display:block;font-size:12px;font-weight:600;color:#d9480f;margin-bottom:1px}
.ticket.done{background:#e3fbec;border-color:#51cf66}
.ticket.done b{background:var(--go)}
.ticket.big{font-size:15px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;margin-bottom:10px;opacity:.55}
.ticket.big:hover{transform:scale(1.02)}
.ticket.big.sel{opacity:1;border-color:#ff4fa3;box-shadow:0 4px 0 #ff4fa355;animation:pulse-in .35s cubic-bezier(.3,1.7,.5,1)}
.muted{color:var(--muted);margin:0 0 14px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;pointer-events:none}
.hidden{display:none}
.modal{background:#fff;border-radius:30px;padding:0 22px 22px;max-width:460px;width:100%;border:5px solid #fff;box-shadow:0 10px 0 #3d2aa0,0 24px 60px #2a1a7a88;max-height:90vh;overflow:auto;pointer-events:auto;animation:modal-in .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes modal-in{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.grip{cursor:move;touch-action:none;user-select:none;padding:10px 0 7px;margin:0 -22px 8px;background:#f6f2ff;border-radius:24px 24px 0 0}
.grip::before{content:"";display:block;width:44px;height:6px;border-radius:3px;background:#d6cbff;margin:0 auto 5px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{flex:1;font-weight:600}
input,select{font:inherit;padding:8px 12px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:#b06cff}
.payopts button{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:8px;background:#f1ecff;color:var(--ink);box-shadow:0 4px 0 #d6cbff}
.payopts button:hover{background:#e7dfff}
.chip{width:22px;height:22px;border-radius:50%;display:inline-block;box-shadow:inset 0 -3px 0 #0003}
table{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:14px;margin:8px 0 16px}
td,th{padding:7px 6px;text-align:right}
td{background:#f8f5ff}td:first-child{border-radius:12px 0 0 12px}td:last-child{border-radius:0 12px 12px 0}
th{color:var(--muted);font-weight:600;font-size:12px}
td:first-child,th:first-child{text-align:left}
tr:nth-child(2) td{background:#fff3c4}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) scale(.6);background:#2b1d52;color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;border:3px solid #fff;box-shadow:0 6px 0 #0003;opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.3,1.8,.5,1);pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.route{cursor:pointer}
.route:hover rect{stroke:#fff;stroke-width:2.5}
.route:not(.owned):hover{filter:drop-shadow(0 0 4px #fff)}
.route.owned{cursor:default}
.fresh{animation:drop .5s cubic-bezier(.3,2,.5,1) both}
@keyframes drop{0%{transform:translateY(-26px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.city circle{fill:#fff;stroke:#2b1d52;stroke-width:3.5}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 1.6s ease-in-out infinite alternate}
.city.goal circle{stroke:#ff4fa3;stroke-width:4;fill:#ffe3f1;animation:goalbob 1.2s ease-in-out infinite alternate}
@keyframes goalbob{to{transform:scale(1.3)}}
.city circle{transform-box:fill-box;transform-origin:center;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.city.hl circle{fill:#ffd43b;stroke:#ff4fa3;stroke-width:2.5;transform:scale(3.4);animation:hlpulse .7s ease-in-out infinite alternate}
@keyframes hlpulse{from{transform:scale(3)}to{transform:scale(3.9);filter:drop-shadow(0 0 4px #ff4fa3)}}
.city.hl text{font-size:22px;fill:#d62f84}
.hl .lb-below{transform:translateY(16px)}.hl .lb-up{transform:translateY(-16px)}.hl .lb-end{transform:translateX(-20px)}.hl .lb-start{transform:translateX(20px)}
.city text{font:700 16px Fredoka,system-ui,sans-serif;fill:#2b1d52;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;pointer-events:none}
.sea text{font:600 15px Fredoka,system-ui,sans-serif;fill:#fff;letter-spacing:.2em;paint-order:stroke;stroke:#2f8fc4;stroke-width:4px;stroke-linejoin:round}
.nation text{font:700 20px Fredoka,system-ui,sans-serif;letter-spacing:.2em;fill:#7c5cff;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;opacity:.8}
@media (max-width:820px){.app{grid-template-columns:1fr;height:auto}.mapbox{height:85vw;flex:none}.bottom{grid-template-columns:1fr}.logcard{max-height:200px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="mapbox"><svg id="map" viewBox="0 0 1024 832" preserveAspectRatio="xMidYMid meet"></svg><div id="status" class="statusbar"></div>
      <div class="zoomctl"><button data-z=".7" title="Zoom in">+</button><button data-z="1.4" title="Zoom out">−</button><button data-z="0" title="Show whole map">⤢</button></div></div>
    <div class="bottom">
      <div class="card"><h3>Your cards</h3><div id="hand" class="hand"></div></div>
      <div class="card"><h3>Your tickets</h3><div id="tickets" class="tickets"></div></div>
    </div>
  </div>
  <aside class="side">
    <div class="card"><div class="titlebar"><b>Jade Rails</b><span><button id="muteBtn" class="ghost" title="Sound on/off"></button> <button id="newBtn" class="ghost">New game</button></span></div><div id="players"></div></div>
    <div class="card"><h3>Market</h3><div id="market" class="market"></div><button id="ticketBtn" class="primary wide">Draw destination tickets</button></div>
    <div class="card logcard"><h3>Log</h3><div id="log" class="log"></div></div>
  </aside>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="car" viewBox="0 0 64 36"><rect x="5" y="5" width="54" height="3" rx="1.5" fill="currentColor"/><rect x="3" y="8" width="58" height="18" rx="3" fill="currentColor"/>
<g fill="#00000033"><rect x="8" y="12" width="9" height="7" rx="1.5"/><rect x="21" y="12" width="9" height="7" rx="1.5"/><rect x="34" y="12" width="9" height="7" rx="1.5"/><rect x="47" y="12" width="9" height="7" rx="1.5"/></g>
<rect x="0" y="22" width="64" height="2" fill="currentColor"/><g fill="currentColor"><circle cx="13" cy="29" r="4.5"/><circle cx="24" cy="29" r="4.5"/><circle cx="40" cy="29" r="4.5"/><circle cx="51" cy="29" r="4.5"/></g></symbol>
<symbol id="tix" viewBox="0 0 24 16"><path d="M2 1h20v4a3 3 0 0 0 0 6v4H2v-4a3 3 0 0 0 0-6z" fill="#ffc93c" stroke="#2b1d52" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 2v12" stroke="#2b1d52" stroke-width="1.3" stroke-dasharray="2 1.6"/></symbol><symbol id="track" viewBox="0 0 24 24"><g stroke="#2b1d52" stroke-width="2" stroke-linecap="round"><path d="M7 7h10M6 12h12M4.5 17h15" stroke="#a0673a" stroke-width="2.6"/><path d="M9 3 5 21M15 3l4 18"/></g></symbol><symbol id="loco" viewBox="0 0 64 36"><g fill="currentColor"><rect x="9" y="3" width="7" height="10" rx="1"/><rect x="6" y="1" width="13" height="3" rx="1"/><rect x="5" y="11" width="36" height="15" rx="6"/><circle cx="27" cy="11" r="3.5"/>
<rect x="39" y="4" width="20" height="22" rx="2"/><rect x="37" y="2" width="24" height="3" rx="1"/><path d="M5 22 L0 32 L10 32 Z"/><circle cx="17" cy="28" r="6"/><circle cx="31" cy="28" r="6"/><circle cx="51" cy="30" r="4"/></g>
<rect x="44" y="8" width="11" height="8" rx="1.5" fill="#00000033"/><rect x="12" y="27" width="22" height="2" fill="#00000040"/></symbol></defs></svg>
<div id="overlay" class="overlay hidden"></div>
<div id="toast" class="toast"></div>
<script>
// ---------- Maps ----------
// Coordinates are [lon, lat]; proj = [lon0, lat0, px per degree lon, px per degree lat] onto the W×H board.
const W=1024,H=832;
const MAPS={
asia:{name:"East Asia",proj:[83,50,16,16],
cities:{"Ulaanbaatar":[106.9,47.9],"Harbin":[126.6,45.8],"Vladivostok":[131.9,43.1],"Sapporo":[141.4,43.1],"Beijing":[116.4,39.9],

function placeLabels(){const SPOTS=[[0,21,"middle",0],[0,-12,"middle",1],[11,5,"start",2],[-11,5,"end",2],[8,19,"start",3],[-8,19,"end",3],[8,-9,"start",3],[-8,-9,"end",3]];

  const inRect=([x1,y1],[x2,y2],[l,t,r,b])=>{let t0=0,t1=1;const dx=x2-x1,dy=y2-y1; // Liang–Barsky: length of the segment inside the box
    for(const[p,q]of[[-dx,x1-l],[dx,r-x1],[-dy,y1-t],[dy,b-y1]]){if(!p){if(q<0)return 0}else{const u=q/p;if(p<0)t0=Math.max(t0,u);else t1=Math.min(t1,u)}}
    return t1>t0?(t1-t0)*Math.hypot(dx,dy):0};
  const lines=ROUTES.map(r=>{const[x1,y1]=XY(r.a),[x2,y2]=XY(r.b),d=Math.hypot(x2-x1,y2-y1),ox=-(y2-y1)/d*r.off,oy=(x2-x1)/d*r.off;return[[x1+ox,y1+oy],[x2+ox,y2+oy]]});
  const placed=[],out={},over=(a,b)=>Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0]))*Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1]));
  for(const c of Object.keys(CITIES).sort((a,b)=>ADJ[b].length-ADJ[a].length)){let best=null;
    for(const s of SPOTS){const B=box(c,s),P=[B[0]-4,B[1]-4,B[2]+4,B[3]+4];
      let cost=s[3]+lines.reduce((t,[p,q])=>t+inRect(p,q,P)*10,0)+placed.reduce((t,o)=>t+over(B,o)*5,0);
      for(const o in CITIES)if(o!==c){const[x,y]=XY(o);if(x>B[0]-8&&x<B[2]+8&&y>B[1]-8&&y<B[3]+8)cost+=400}

function shortest(a,b,w){const d={},prev={},done=new Set();for(const c in CITIES)d[c]=Infinity;d[a]=0;
  for(;;){let u=null;for(const c in d)if(!done.has(c)&&(u===null||d[c]<d[u]))u=c;if(u===null||d[u]===Infinity||u===b)break;done.add(u);
    for(const r of ADJ[u]){const wt=w(r);if(wt===Infinity)continue;const v=r.a===u?r.b:r.a;if(d[u]+wt<d[v]){d[v]=d[u]+wt;prev[v]=r}}}
  if(d[b]===Infinity)return{cost:Infinity,routes:[]};const routes=[];for(let c=b;c!==a;){const r=prev[c];routes.push(r.id);c=r.a===c?r.b:r.a}
  return{cost:d[b],routes}}

// All levels plan shortest paths for their tickets and collect matching cards.

  const extra=x=>x.s.cost===Infinity?999:x.s.routes.filter(id=>!used.has(id)&&G.owner[id]===null).reduce((a,id)=>a+ROUTES[id].len,0);
  const rest=offered.map(t=>({t,s:shortest(TICKETS[t].a,TICKETS[t].b,w)})),keep=[];
  while(rest.length){rest.sort((a,b)=>extra(a)-extra(b));
    const x=rest[0],e=extra(x);if(keep.length>=min&&e>budget)break;keep.push(x.t);rest.shift();budget-=e;x.s.routes.forEach(id=>used.add(id))}
  return keep}
function botTurn(p){if(G.over||G.pending||cur()!==p)return;
  const L=p.level,plan=makePlan(p),afford=r=>routeOk(r,p)&&payOptions(r,p).length>0;
  const anyAfford=()=>ROUTES.filter(afford).sort((a,b)=>b.len-a.len);
  const endgame=G.finalLeft>0||G.players.some(q=>q.trains<=3);
  if(Math.random()<RANDOM[L]){const a=anyAfford();return a.length&&Math.random()<.5?botClaim(p,pick(a)):botDraw(p,new Set())}
  const c=[...plan.need.keys()].map(i=>ROUTES[i]).filter(afford).sort((a,b)=>plan.need.get(b.id)-plan.need.get(a.id));
  if(c.length)return botClaim(p,c[0]);
  if(!plan.open&&!endgame&&L>0&&p.trains>=18&&G.tdeck.length)return drawTickets();
  const a=anyAfford();
  if(a.length&&(endgame||(!plan.open&&a[0].len>=2)||!canDrawAny()))return botClaim(p,a[0]);
  botDraw(p,wants(p,plan.need))}
function wants(p,need){const w=new Set();for(const rid of need.keys()){const r=ROUTES[rid];
  w.add(r.color==="gray"?COLORS.reduce((a,c)=>p.hand[c]>p.hand[a]?c:a):r.color)}return w}
function botClaim(p,r){const o=payOptions(r,p).sort((x,y)=>(y==="wild"?-1:p.hand[y])-(x==="wild"?-1:p.hand[x]));claim(r.id,o[0])}
function botDraw(p,want){if(!canDrawAny()){const a=ROUTES.filter(r=>routeOk(r,p)&&payOptions(r,p).length);return a.length?botClaim(p,a[0]):pass()}
  botPick(p,want,true);if(!G.over&&cur()===p&&G.drawn===1)botPick(p,want,false)||endTurn()}
function botPick(p,want,first){const F=G.faceUp,ok=i=>F[i]&&(first||F[i]!=="wild");
  let i=F.findIndex((c,j)=>ok(j)&&c!=="wild"&&want.has(c));
  if(p.level===0&&Math.random()<.4){const o=[0,1,2,3,4].filter(ok);if(o.length)i=pick(o)}
  if(i>=0)return takeFace(i);if(takeDeck())return true;
  i=[0,1,2,3,4].find(ok);return i!==undefined&&takeFace(i)}

// Self-check: all-bot games must end and score sanely. Run simulate() in the console.
function simulate(n=30,levels=[0,1,2,2],map=MAP.id){SIM=true;const wins=[0,0,0,0],totals=[0,0,0,0];
  try{for(let g=0;g<n;g++){newGame(levels.map((l,i)=>({name:"B"+i+LEVELS[l],bot:true,level:l})),map);let k=0;
    while(!G.over&&k++<5000)botTurn(cur());console.assert(G.over,"game did not end");
    console.assert(G.players.every(p=>p.trains>=0&&Object.values(p.hand).every(v=>v>=0)),"negative stock");
    console.assert(G.players.every(p=>p.tickets.filter(t=>TICKETS[t].long).length<=1)&&!G.tdeck.some(t=>TICKETS[t].long),"long ticket leaked");
    console.assert(G.deck.length+G.discard.length+G.faceUp.filter(Boolean).length+G.players.reduce((s,p)=>s+cardCount(p),0)===110,"card leak");
    wins[G.results[0].p.i]++;G.results.forEach(r=>totals[r.p.i]+=r.total)}}
  finally{SIM=false;G=null}return{wins,avg:totals.map(t=>Math.round(t/n))}}

// ---------- Sound (synthesized with Web Audio, no files) ----------
let AC=null,muted=false;try{muted=localStorage.getItem("jr-muted")==="1"}catch{}
function tone(f,t,dur,{type="sine",vol=.12,to}={}){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}
function noise(t,dur,{vol=.2,freq=1200,q=1}={}){const b=AC.createBuffer(1,AC.sampleRate*dur|0,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  n.buffer=b;fl.type="bandpass";fl.frequency.value=freq;fl.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  n.connect(fl).connect(g).connect(AC.destination);n.start(t)}
const SFX={
  card:t=>noise(t,.12,{vol:.3,freq:3200,q:.7}),                                   // card swish
  wild:t=>[660,880,1320].forEach((f,i)=>tone(f,t+i*.06,.3,{type:"triangle",vol:.08})),
  claim:(t,n)=>{for(let i=0;i<n;i++){noise(t+i*.14,.08,{vol:.45,freq:450,q:1.4});noise(t+i*.14+.07,.06,{vol:.25,freq:900})} // chugs, one per car
    tone(740,t+n*.14,.45,{type:"square",vol:.035});tone(932,t+n*.14,.45,{type:"square",vol:.035})},                      // whistle
  ticket:t=>{noise(t,.2,{vol:.15,freq:5000,q:.5});noise(t+.13,.16,{vol:.12,freq:4200,q:.5})},
  done:t=>{tone(1047,t,.15,{vol:.1});tone(1568,t+.09,.35,{vol:.1})},             // ticket completed
  turn:t=>{tone(784,t,.18,{vol:.09});tone(1047,t+.12,.3,{vol:.09})},
  final:t=>[0,.4,.8].forEach(d=>{tone(523,t+d,.7,{type:"triangle",vol:.1});tone(1046,t+d,.5,{vol:.03})}),
  win:t=>[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.14,i===3?.8:.35,{type:"triangle",vol:.12})),
  lose:t=>[392,349,294].forEach((f,i)=>tone(f,t+i*.22,.5,{type:"triangle",vol:.1})),
  error:t=>tone(220,t,.15,{type:"square",vol:.04,to:150})};
function sfx(name,arg,delay=0){if(SIM||muted)return;try{AC=AC||new AudioContext();if(AC.state==="suspended")AC.resume();SFX[name](AC.currentTime+.02+delay,arg)}catch{}}

// ---------- Map effects ----------
function fxAdd(html,ms){if(SIM)return;const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.innerHTML=html;$("fx").appendChild(g);setTimeout(()=>g.remove(),ms)}
const segLine=(r,cls,col)=>{const[x1,y1]=XY(r.a),[x2,y2]=XY(r.b);return`<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}"/>`};
function fxClaim(r,o){const[x1,y1]=XY(r.a),[x2,y2]=XY(r.b);
  const mx=(x1+x2)/2,my=(y1+y2)/2,cheer=["","","","Nice!","Great!","Awesome!","Spectacular!"][r.len]||"Spectacular!";
  const pops=Array.from({length:10+r.len*3},(_,i)=>{const t=Math.random(),a=Math.random()*6.28,d=20+Math.random()*50;
    return`<circle class="fx-pop" cx="${x1+(x2-x1)*t}" cy="${y1+(y2-y1)*t}" r="${2+Math.random()*4}" fill="${i%3?PCOL[o]:"#ffd43b"}" stroke="#fff" stroke-width="1.5" style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;animation-delay:${t*r.len*70}ms"/>`}).join("");
  fxAdd(segLine(r,"fx-glow",PCOL[o])+pops+`<text class="fx-pts" x="${mx}" y="${my-14}" fill="${PCOL[o]}">+${PTS[r.len]}</text>`+(cheer?`<text class="fx-word" x="${mx}" y="${my-50}">${cheer}</text>`:""),1700)}
function ownedPath(p,a,b){const prev={[a]:null},q=[a];
  while(q.length){const c=q.shift();if(c===b)break;for(const r of ADJ[c])if(G.owner[r.id]===p.i){const n=r.a===c?r.b:r.a;if(!(n in prev)){prev[n]=r;q.push(n)}}}
  const out=[];for(let c=b;prev[c];){const r=prev[c];out.push(r);c=r.a===c?r.b:r.a}return out}
function fxTicket(t){const T=TICKETS[t];
  fxAdd(ownedPath(human(),T.a,T.b).map(r=>segLine(r,"fx-path","#f5b301")).join("")+
    [T.a,T.b].map(c=>{const[x,y]=XY(c);return`<circle class="fx-ring" cx="${x}" cy="${y}" r="10"/><circle class="fx-ring" style="animation-delay:.45s" cx="${x}" cy="${y}" r="10"/>`}).join(""),3500);
  const cols=[...PCOL,...COLORS.map(c=>HEX[c])],b=document.createElement("div");b.className="banner";
  b.innerHTML=`<div class="bt">Destination complete!</div><div>${T.a} → ${T.b}</div><b>+${T.pts}</b>`+Array.from({length:40},(_,i)=>
    `<i style="--x:${(Math.random()*2-1)*240}px;--y:${-40-Math.random()*180}px;--r:${Math.random()*720}deg;background:${cols[i%cols.length]};animation-delay:${Math.random()*.15}s"></i>`).join("");
  document.body.appendChild(b);setTimeout(()=>b.remove(),3500)}

// ---------- Map zoom (trackpad scroll / pinch / wheel) and drag to pan ----------
const svgEl=$("map");let VB=[0,0,W,H],panMoved=false;
function setVB(x,y,w){const h=w*H/W;VB=[Math.min(Math.max(0,x),W-w),Math.min(Math.max(0,y),H-h),w,h];svgEl.setAttribute("viewBox",VB.join(" "))}
function zoomAt(cx,cy,f){const nw=Math.min(W,Math.max(W/6,VB[2]*f));f=nw/VB[2];
  const p=new DOMPoint(cx,cy).matrixTransform(svgEl.getScreenCTM().inverse());setVB(p.x-(p.x-VB[0])*f,p.y-(p.y-VB[1])*f,nw)}
svgEl.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*(e.ctrlKey?.01:.0025)))},{passive:false});
const ptrs=new Map();let pinch=null,start=null;
svgEl.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);start=[e.clientX,e.clientY];panMoved=false;pinch=null});
addEventListener("pointermove",e=>{const prev=ptrs.get(e.pointerId);if(!prev)return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,pinch/d);pinch=d;panMoved=true;return}
  if(!panMoved&&Math.hypot(e.clientX-start[0],e.clientY-start[1])<5)return;   // small jitter still counts as a click
  panMoved=true;const s=1/svgEl.getScreenCTM().a;setVB(VB[0]-(e.clientX-prev[0])*s,VB[1]-(e.clientY-prev[1])*s,VB[2])});
const endPtr=e=>{ptrs.delete(e.pointerId);pinch=null};addEventListener("pointerup",endPtr);addEventListener("pointercancel",endPtr);
document.querySelector(".zoomctl").onclick=e=>{const z=+e.target.dataset.z;if(isNaN(z))return;
  if(!z)return setVB(0,0,W);const b=svgEl.getBoundingClientRect();zoomAt(b.left+b.width/2,b.top+b.height/2,z)};

// ---------- Save / resume (browser storage, autosaved on every change) ----------
function save(){if(SIM||!G||NET)return;try{G.over?localStorage.removeItem("jrp-save"):localStorage.setItem("jrp-save",JSON.stringify(G))}catch{}}
function loadSave(){try{const g=JSON.parse(localStorage.getItem("jrp-save"));return g&&!g.over?g:null}catch{return null}}

// ---------- Online (PeerJS: browsers connect directly, the public PeerJS server only introduces them) ----------
// The host's browser runs the game and the bots. Guests send their moves to the host and get the whole state back after every change.
// ponytail: host tab must stay open (closing it ends the game); move the game into a Cloudflare Durable Object if that ever hurts.
const ROOM=(new URLSearchParams(location.search).get("room")||"").toUpperCase().slice(0,4);
const ACTIONS={takeFace,takeDeck,claim,drawTickets,pass,keepTickets};
let ticketsOpen=false;
function act(a,...args){if(NET&&!NET.host)return NET.conn.send({a,args});ACTIONS[a](...args)}
const loadPeer=()=>window.Peer?Promise.resolve():new Promise((ok,err)=>{const s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js";s.onload=ok;s.onerror=()=>err(toast("Can't load the online library. Are you offline?"));document.head.appendChild(s)});
function leaveNet(){if(NET){const n=NET;NET=null;ME=0;n.peer.destroy()}}
const lobbyNames=()=>[NET.name,...[...NET.conns.keys()].map(c=>c.nm)];
const lobbyHTML=names=>names.map((n,i)=>`<div class="player" style="--pc:${PCOL[i]}"><span class="dot"></span><div class="pname">${n}${i?"":" <span class='sub'>host</span>"}</div></div>`).join("");
function lobbyUpdate(){const names=lobbyNames();if($("lobbyList"))$("lobbyList").innerHTML=lobbyHTML(names);for(const c of NET.conns.keys())c.send({lobby:names})}
function broadcast(){if(NET?.host&&NET.started)for(const[c,seat]of NET.conns)if(seat!==null&&c.open)c.send({G,me:seat})}

async function hostRoom(name,map){await loadPeer();leaveNet();
  const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join(""),peer=new Peer("jade-rails-"+code);
  NET={host:true,peer,code,name,conns:new Map(),started:false};
  peer.on("error",e=>toast(e.type==="unavailable-id"?"Room code taken, try again.":"Online error: "+e.type));
  peer.on("open",()=>{const link=location.href.split(/[?#]/)[0]+"?room="+code;
    ov(`<h2>Room ${code}</h2><p class="muted">Friends open the game and join with this code, or open the link. Keep this tab open: your browser runs the game.</p>
      <div class="row"><input readonly value="${link}" style="flex:1;min-width:0"><button class="ghost" id="copyBtn">Copy link</button></div>
      <h3>Players</h3><div id="lobbyList" style="margin-bottom:12px"></div>
      <div class="row"><label for="mp">Map</label><select id="mp">${Object.values(MAPS).map(m=>`<option value="${m.id}" ${m.id===map?"selected":""}>${m.name}</option>`).join("")}</select></div>
      <h3>Add bots</h3>${botRows(false)}<button class="primary wide" id="goBtn">Start game</button>`);
    lobbyUpdate();$("copyBtn").onclick=()=>navigator.clipboard.writeText(link).then(()=>toast("Link copied"));
    $("goBtn").onclick=()=>{const guests=[...NET.conns.keys()],bots=pickBots();
      if(!guests.length&&!bots.length)return toast("Wait for a friend to join, or add a bot.");if(guests.length+bots.length>3)return toast("4 players max.");
      guests.forEach((c,i)=>NET.conns.set(c,i+1));NET.started=true;closeOv();ME=0;
      newGame([{name,bot:false},...guests.map(c=>({name:c.nm,bot:false})),...bots],$("mp").value)}});
  peer.on("connection",conn=>conn.on("open",()=>{if(NET?.peer!==peer)return conn.close();const nm=clean(conn.metadata?.name),refuse=m=>{conn.send({err:m});setTimeout(()=>conn.close(),500)};
    if(NET.started){ // same name can take back a seat that lost its connection
      const taken=new Set(NET.conns.values()),seat=G.players.findIndex((p,i)=>i&&!p.bot&&p.name===nm&&!taken.has(i));
      if(seat<0)return refuse("That game has already started.");conn.nm=nm;NET.conns.set(conn,seat);toast(`${nm} rejoined`);conn.send({G,me:seat})}
    else{if(NET.conns.size>=3)return refuse("The room is full.");let n=nm,k=2;while(lobbyNames().includes(n))n=nm.slice(0,10)+k++;
      conn.nm=n;NET.conns.set(conn,null);lobbyUpdate()}
    conn.on("data",m=>{const seat=NET?.conns.get(conn);if(seat)onAction(seat,m)});
    conn.on("close",()=>{if(NET?.peer!==peer)return;NET.conns.delete(conn);toast(`${conn.nm} left`);if(!NET.started)lobbyUpdate()})}))}
// Host side: a guest may only act on its own turn (or its own ticket choice), with arguments the rules accept.
function onAction(seat,m){if(!G||G.over||!m||!Object.hasOwn(ACTIONS,m.a)||!Array.isArray(m.args))return;const pd=G.pending;
  if(pd?pd.p!==seat||m.a!=="keepTickets":G.cur!==seat||m.a==="keepTickets")return;
  if(pd){const k=m.args[0];if(!Array.isArray(k)||new Set(k).size!==k.length||k.length<pd.min||!k.every(t=>pd.offered.includes(t)))return}
  ACTIONS[m.a](...m.args)}

async function joinRoom(code,name){await loadPeer();leaveNet();const peer=new Peer();NET={host:false,peer,code};
  peer.on("error",e=>{toast(e.type==="peer-unavailable"?`Room ${code} not found.`:"Online error: "+e.type)});
  peer.on("open",()=>{const conn=peer.connect("jade-rails-"+code,{metadata:{name},serialization:"json",reliable:true});NET.conn=conn;
    conn.on("open",()=>ov(`<h2>Room ${code}</h2><p class="muted">Joined. Waiting for the host to start the game…</p><div id="lobbyList"></div>`));
    conn.on("data",m=>{if(m.err){toast(m.err);leaveNet()}else if(m.lobby){if($("lobbyList"))$("lobbyList").innerHTML=lobbyHTML(m.lobby)}else if(m.G)receive(m.G,m.me)});
    conn.on("close",()=>{if(NET?.conn===conn){toast("Disconnected from the host.");leaveNet()}})})}
// Guest side: swap in the host's state and replay the sounds and effects the host saw.
function receive(g,me){const prev=NET.live?G:null,myDone=()=>human().tickets.filter(t=>connected(human(),TICKETS[t].a,TICKETS[t].b));
  const before=prev?myDone():[];ME=me;useMap(g.map);G=g;NET.live=true;if(!prev){clearTimeout(timer);ticketsOpen=false;closeOv()}
  const lc=G.lastClaim;if(lc&&lc.at!==NET.lastAt){NET.lastAt=lc.at;if(prev){lc.at=Date.now();const r=ROUTES[lc.rid];fxClaim(r,G.owner[r.id]);sfx("claim",r.len)}}
  render();if(!prev)return G.pending?.p===ME&&showTickets();
  myDone().filter(t=>!before.includes(t)).forEach((t,i)=>setTimeout(()=>{sfx("done");fxTicket(t)},1200+i*1400));
  if(G.cur===ME&&prev.cur!==ME&&!G.over)sfx("turn",0,.6);
  if(G.pending?.p===ME&&!ticketsOpen)showTickets();
  if(G.over&&!prev.over){sfx(G.results[0].p.i===ME?"win":"lose",0,.4);showEnd()}}

    <filter id="carshadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="1.5" stdDeviation=".6" flood-color="#2b1d52" flood-opacity=".7"/></filter>
    <clipPath id="landclip">${land}</clipPath><symbol id="mini" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#6cc8f5"/><g fill="#c9f2b0" stroke="#2b1d52" stroke-width="8">${land}</g></symbol></defs>
    <rect width="${W}" height="${H}" fill="#5cc2f2"/><rect width="${W}" height="${H}" fill="url(#waves)"/>
    <g fill="#3a9fd6" transform="translate(4 6)">${land}</g>
    <g fill="#fff3c4" stroke="#fff3c4" stroke-width="12" stroke-linejoin="round">${land}</g>${tinted}
    <g clip-path="url(#landclip)">
      <g fill="none" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${fill(M.rivers,p=>`<polyline points="${p}"/>`)}</g>
      <g fill="#6cc8f5" stroke="#2b1d52" stroke-width="1.6">${fill(M.lakes,p=>`<polygon points="${p}"/>`)}</g>
      <g fill="none" stroke-linejoin="round" stroke-linecap="round"><g stroke="#fff" stroke-width="5" opacity=".8">${fill(M.border,p=>`<polyline points="${p}"/>`)}</g>
        <g stroke="#b06cff" stroke-width="2.4" stroke-dasharray="7 6">${fill(M.border,p=>`<polyline points="${p}"/>`)}</g></g></g>
    <g fill="none" stroke="#2b1d52" stroke-width="2.6" stroke-linejoin="round">${land}</g>
    <g class="nation" text-anchor="middle">${M.countries.map(([n,p])=>{const[x,y]=LL(p);return`<text x="${x}" y="${y}">${n}</text>`}).join("")}</g>
    <g transform="translate(${cx} ${cy}) rotate(-8)"><circle r="27" fill="#fff" stroke="#2b1d52" stroke-width="3"/><path d="M0 -22 L6 0 L0 22 L-6 0Z" fill="#ff4fa3" stroke="#2b1d52" stroke-width="2" stroke-linejoin="round"/><path d="M-22 0 L0 -5 L22 0 L0 5Z" fill="#ffd43b" stroke="#2b1d52" stroke-width="2" stroke-linejoin="round"/><text y="-33" text-anchor="middle" font-size="15" font-weight="700" fill="#2b1d52">N</text></g>
    <g font-size="26" text-anchor="middle">${M.seas.map(([n,p],k)=>{const[x,y]=LL(p);return`<text class="bob" x="${x}" y="${y-22}" style="animation-delay:${-k*.7}s">${["⛵","🐳","🐟","🐬","🚢"][k%5]}</text>`}).join("")}</g>
    <g class="sea">${M.seas.map(([n,p])=>{const[x,y]=LL(p);return`<text x="${x}" y="${y}" text-anchor="middle">${n}</text>`}).join("")}</g><g id="routes"></g><g id="cities">`+
    Object.keys(CITIES).map(c=>{const[x,y]=XY(c);return`<g class="city" data-city="${c}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="7"/><text class="lb-${LABEL[c][2]==="middle"?(LABEL[c][1]>0?"below":"up"):LABEL[c][2]}" x="${LABEL[c][0]}" y="${LABEL[c][1]}" text-anchor="${LABEL[c][2]}">${c}</text></g>`}).join("")+`</g><g id="fx"></g>`}

// Unclaimed routes are flat colored slots; claimed ones carry train-car pieces in the owner's color (locomotive first).
function routeSVG(r){const[x1,y1]=XY(r.a),[x2,y2]=XY(r.b),dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d,ox=-uy*r.off,oy=ux*r.off;
  const a=Math.atan2(dy,dx)*180/Math.PI,ang=(Math.abs(a)>90?a+180:a).toFixed(1); // keep cars wheels-down
  const pad=9,seg=(d-2*pad)/r.len,cl=seg-3,o=G?G.owner[r.id]:null,fresh=G&&G.lastClaim&&G.lastClaim.rid===r.id&&Date.now()-G.lastClaim.at<900;
  const op=G&&o===null&&!free(r,human())?.22:1,h=Math.min(cl*36/64,15);
  let s=`<g class="route${o!==null?" owned":""}" data-rid="${r.id}" opacity="${op}"><title>${r.a} – ${r.b}: ${r.len} ${r.color}${o!==null?" (claimed by "+G.players[o].name+")":""}</title>`+
    `<line x1="${x1+ox}" y1="${y1+oy}" x2="${x2+ox}" y2="${y2+oy}" stroke="transparent" stroke-width="14"/>`;
  for(let k=0;k<r.len;k++){const t=pad+seg*(k+.5),tr=`translate(${(x1+ox+ux*t).toFixed(1)} ${(y1+oy+uy*t).toFixed(1)}) rotate(${ang})`;
    const slot=`<rect x="${(-cl/2).toFixed(1)}" y="-4" width="${cl.toFixed(1)}" height="8" rx="4" fill="${HEX[r.color]}" stroke="#2b1d52" stroke-width="1.6"${o!==null?' opacity=".35"':""}/>`;
    s+=`<g transform="${tr}">${slot}${o===null?"":`<g class="${fresh?"fresh":""}" style="color:${PCOL[o]};animation-delay:${k*70}ms"><use href="#${k===0?"loco":"car"}" x="${(-cl/2).toFixed(1)}" y="${(-h/2-2).toFixed(1)}" width="${cl.toFixed(1)}" height="${h.toFixed(1)}" preserveAspectRatio="none" filter="url(#carshadow)"/></g>`}</g>`}
  return s+"</g>"}

function render(){if(SIM||!G)return;const me=human(),myTurn=cur()===me&&!G.over&&!G.pending;
  $("routes").innerHTML=ROUTES.map(routeSVG).join("");
  const goals=new Set();me.tickets.forEach(t=>{const T=TICKETS[t];if(!connected(me,T.a,T.b)){goals.add(T.a);goals.add(T.b)}});
  document.querySelectorAll(".city").forEach(g=>g.classList.toggle("goal",goals.has(g.dataset.city)));
  $("players").innerHTML=G.players.map(p=>`<div class="player ${p===cur()&&!G.over?"active":""}" style="--pc:${p.color}"><span class="dot"></span>
    <div class="pname">${p.name}<div class="sub">${p.bot?LEVELS[p.level]+" bot":p===me?"You":"Online"}</div></div>
    <div class="stats"><span class="st" title="Trains left"><svg viewBox="0 0 64 36"><use href="#loco"/></svg>${p.trains}</span><span class="st" title="Cards in hand"><span class="mc">${cardCount(p)}</span></span><span class="st" title="Destination tickets"><svg viewBox="0 0 24 16"><use href="#tix"/></svg>${p.tickets.length}</span><span class="st" title="Longest route"><svg viewBox="0 0 24 24"><use href="#track"/></svg>${longest(p)}</span></div><div class="score">${p.score}</div></div>`).join("");
  $("market").innerHTML=G.faceUp.map((c,i)=>c?`<div class="tcard c-${c} ${!myTurn||(c==="wild"&&G.drawn)?"disabled":""}" data-i="${i}" title="${c}">${card(c,c==="wild"?`<span class="lbl">Wild</span>`:"")}</div>`:`<div class="tcard empty"></div>`).join("")+
    `<div class="tcard deck ${!myTurn||!(G.deck.length||G.discard.length)?"disabled":""}" data-i="deck" title="Draw from deck"><small>Deck</small>${G.deck.length+G.discard.length}</div>`;
  $("ticketBtn").disabled=!myTurn||G.drawn>0||!G.tdeck.length;
  $("hand").innerHTML=[...COLORS,"wild"].map(c=>`<div class="tcard c-${c} ${me.hand[c]?"":"zero"}" title="${c}">${card(c,`<span class="n">${me.hand[c]}</span>`)}</div>`).join("");
  $("tickets").innerHTML=me.tickets.map(t=>{const T=TICKETS[t];return ticketHTML(t,connected(me,T.a,T.b)?"done":"")}).join("")||`<span class="sub">None yet</span>`;
  const stuck=myTurn&&!G.drawn&&!canDrawAny()&&!G.tdeck.length&&!ROUTES.some(r=>routeOk(r,me)&&payOptions(r,me).length);
  $("status").innerHTML=(G.over?"Game over":G.pending?(G.pending.p===ME?"Choose your destination tickets":`${G.players[G.pending.p].name} is choosing tickets…`):
    myTurn?(G.drawn?"Draw one more card (not a face-up wild)":"Your turn: draw 2 cards, claim a route, or draw tickets"):`${cur().name} is playing…`)+
    (stuck?` <button class="ghost" id="passBtn">Pass</button>`:"")+(G.finalLeft>0&&!G.over?`<span class="final">Final round</span>`:"");
  if(stuck)$("passBtn").onclick=()=>act("pass");
  $("log").innerHTML=G.log.map(m=>`<div>${m}</div>`).join("");save();broadcast()}

function showTickets(){const pd=G.pending,sel=new Set(pd.offered);ticketsOpen=true;
  const draw=()=>{ov(`<h2>${pd.initial?"Choose your destinations":"New destination tickets"}</h2>
    <p class="muted">Keep at least ${pd.min}.${pd.initial?' One is a <b>long route</b>: if you skip it, it leaves the game.':''} Connect both cities with your own routes by game end to score the points, or lose them.</p>
    ${pd.offered.map(t=>ticketHTML(t,"big"+(sel.has(t)?" sel":""))).join("")}
    <button class="primary wide" id="keepBtn" ${sel.size<pd.min?"disabled":""}>Keep ${sel.size}</button>`);
    overlay.querySelectorAll("[data-t]").forEach(el=>{const t=+el.dataset.t;el.onclick=()=>{sel.has(t)?sel.delete(t):sel.add(t);draw();hl(t)};
      el.onmouseenter=()=>hl(t);el.onmouseleave=()=>hl(null)});
    $("keepBtn").onclick=()=>{closeOv();hl(null);ticketsOpen=false;act("keepTickets",pd.offered.filter(t=>sel.has(t)))}};
  draw()}
function showEnd(){const R=G.results;
  ov(`<h2>${R[0].p.i===ME?"You win!":R[0].p.name+" wins"}</h2>
    <table><tr><th>Player</th><th>Routes</th><th>Tickets</th><th>Longest</th><th>Total</th></tr>
    ${R.map(r=>`<tr><td><span class="dot" style="--pc:${r.p.color};display:inline-block;margin-right:6px"></span>${r.p.name}</td><td>${r.routes}</td>
      <td>+${r.plus} / −${r.minus}</td><td>${r.long}${r.bonus?" (+10)":""}</td><td><b>${r.total}</b></td></tr>`).join("")}</table>
    <div class="row"><button class="ghost wide" id="viewBtn">View board</button><button class="primary wide" id="againBtn">New game</button></div>`);
  $("viewBtn").onclick=closeOv;$("againBtn").onclick=showSetup}
function showSetup(){const sv=loadSave();
  ov(`<h2>Jade Rails Pop</h2><p class="muted">Build rail lines across East Asia, Germany or France. Collect cards, claim routes, and connect your destination cities before the trains run out.</p>
    ${sv?`<button class="primary wide" id="resumeBtn" style="margin-bottom:6px">Resume saved game</button>
    <p class="sub" style="text-align:center;margin:0 0 14px">${sv.players.map(p=>`${p.name} ${p.score}`).join(" · ")} · ${sv.players[0].trains} trains left</p>
    <h3>Or start a new game</h3>`:""}
    <div class="row"><label for="mp">Map</label><select id="mp">${Object.values(MAPS).map(m=>`<option value="${m.id}" ${m===MAP?"selected":""}>${m.name}</option>`).join("")}</select></div>
    <div class="row"><label for="nm">Your name</label><input id="nm" value="You" maxlength="12"></div>
    ${botRows(true)}
    <button class="primary wide" id="startBtn">Start game</button>
    <h3 style="margin-top:16px">Play online with friends</h3>
    <div class="row"><button class="ghost wide" id="hostBtn">Host a room</button></div>
    <div class="row"><input id="code" placeholder="Room code" maxlength="4" value="${ROOM}" style="flex:1;text-transform:uppercase"><button class="ghost" id="joinBtn">Join</button></div>`);
  if(sv)$("resumeBtn").onclick=()=>{leaveNet();resume(sv)};
  const myName=()=>{const n=clean($("nm").value);try{localStorage.setItem("jr-name",n)}catch{}return n};
  $("nm").value=(()=>{try{return localStorage.getItem("jr-name")}catch{}})()||"You";
  $("startBtn").onclick=()=>{const bots=pickBots();
    if(!bots.length)return toast("Pick at least one opponent.");leaveNet();closeOv();newGame([{name:myName(),bot:false},...bots],$("mp").value)};
  const online=f=>()=>{const n=myName();if(n==="You")return toast("Type your name first.");f(n)};
  $("hostBtn").onclick=online(n=>hostRoom(n,$("mp").value));
  $("joinBtn").onclick=online(n=>{const c=$("code").value.trim().toUpperCase();c.length===4?joinRoom(c,n):toast("Enter the 4-letter room code.")})}
const botRows=on=>BOT_NAMES.map((n,i)=>`<div class="row"><label for="b${i}">${n}</label><select id="b${i}"><option value="-1">Not playing</option>${LEVELS.map((l,j)=>`<option value="${j}" ${on&&j===1?"selected":""}>${l}</option>`).join("")}</select></div>`).join("");
const pickBots=()=>BOT_NAMES.map((n,i)=>({name:n,bot:true,level:+$("b"+i).value})).filter(b=>b.level>=0);
const clean=s=>String(s||"").replace(/[<>&"']/g,"").trim().slice(0,12)||"You"; // names from other players end up in innerHTML

$("map").addEventListener("click",e=>{if(panMoved)return;const g=e.target.closest("[data-rid]");if(!g||!G)return;const r=ROUTES[+g.dataset.rid],me=human();
  if(G.over||cur()!==me||G.pending)return nope("Wait for your turn.");
  if(G.drawn)return nope("You already drew a card: draw one more.");
  if(!free(r,me))return nope("That route isn't available.");
  if(me.trains<r.len)return nope("Not enough trains left.");
  const o=payOptions(r,me);if(!o.length)return nope(`Need ${r.len} ${r.color==="gray"?"cards of one color":r.color+" cards"} (wilds count).`);
  if(o.length===1)return act("claim",r.id,o[0]);
  ov(`<h2>Pay for ${r.a} – ${r.b}</h2><p class="muted">${r.len} cards, worth ${PTS[r.len]} points.</p><div class="payopts">${o.map(c=>{const n=c==="wild"?0:Math.min(me.hand[c],r.len),w=r.len-n;
    return`<button data-c="${c}"><span class="chip c-${c}"></span>${[n?n+" "+c:"",w?w+" wild":""].filter(Boolean).join(" + ")}</button>`}).join("")}</div>
    <button class="ghost wide" id="cancelPay">Cancel</button>`);
  overlay.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{closeOv();act("claim",r.id,b.dataset.c)});$("cancelPay").onclick=closeOv});
$("market").addEventListener("click",e=>{const el=e.target.closest("[data-i]");if(!el||el.classList.contains("disabled"))return;
  el.dataset.i==="deck"?act("takeDeck"):act("takeFace",+el.dataset.i)});
$("ticketBtn").onclick=()=>act("drawTickets");
$("newBtn").onclick=showSetup;
const muteLabel=()=>$("muteBtn").textContent=muted?"🔇":"🔊";muteLabel();
$("muteBtn").onclick=()=>{muted=!muted;try{localStorage.setItem("jr-muted",muted?"1":"0")}catch{}muteLabel();sfx("card")};
$("tickets").addEventListener("mouseover",e=>{const t=e.target.closest("[data-t]");hl(t?+t.dataset.t:null)});
$("tickets").addEventListener("mouseleave",()=>hl(null));
// Picking a map in a menu shows it right away. The game in memory stays in the save, so Resume still works.
function previewMap(id){clearTimeout(timer);G=null;useMap(id);$("routes").innerHTML=ROUTES.map(routeSVG).join("")}
overlay.addEventListener("change",e=>{if(e.target.id==="mp")previewMap(e.target.value)});
useMap(loadSave()?.map||"asia");$("routes").innerHTML=ROUTES.map(routeSVG).join("");showSetup();
</script>
