<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jade Rails</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1f2430;--muted:#6b7280;--line:#e3e7ee;--accent:#12a594;--sea:#d5e7f1;--land:#f6f2e9;--coast:#d9cfbb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;padding:12px;height:100vh}
.main{display:flex;flex-direction:column;gap:12px;min-height:0}
.mapbox{flex:1;min-height:0;background:var(--sea);border-radius:16px;overflow:hidden;position:relative}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:36px;height:36px;padding:0;background:#fffffff0;box-shadow:0 2px 8px #0000001a;font-size:18px}
#fx{pointer-events:none}
.fx-glow{stroke-linecap:round;opacity:0;animation:glow 1.2s ease-out}
@keyframes glow{0%{opacity:.9;stroke-width:6}100%{opacity:0;stroke-width:30}}
.fx-pts{font:800 22px system-ui,sans-serif;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;animation:rise 1.6s ease-out forwards}
@keyframes rise{from{transform:translateY(6px);opacity:0}15%{opacity:1}to{transform:translateY(-34px);opacity:0}}
.fx-path{stroke-width:9;stroke-linecap:round;stroke-dasharray:14 10;filter:drop-shadow(0 0 5px #f5b301);animation:march .6s linear infinite,fadeout 3.4s ease-in forwards}
@keyframes march{to{stroke-dashoffset:-24}}
@keyframes fadeout{0%,75%{opacity:.95}100%{opacity:0}}
.fx-ring{fill:none;stroke:#f5b301;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ring 1.3s ease-out 2 both}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(4.5);opacity:0}}
.banner{position:fixed;left:50%;top:16%;background:#fff;border-radius:18px;padding:16px 30px;text-align:center;box-shadow:0 14px 44px #0004;z-index:30;pointer-events:none;animation:pop 3.4s ease forwards}
.banner .bt{font-weight:800;font-size:20px;color:#b45309}
.banner b{display:block;font-size:30px;color:var(--accent)}
.banner i{position:absolute;left:50%;top:50%;width:8px;height:12px;border-radius:2px;animation:conf 1.3s ease-out forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes pop{0%{transform:translate(-50%,-24px) scale(.8);opacity:0}10%{transform:translate(-50%,0) scale(1.06);opacity:1}16%{transform:translate(-50%,0) scale(1)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-12px)}}
.statusbar{position:absolute;top:12px;left:12px;background:#fffffff0;border-radius:999px;padding:8px 14px;font-weight:600;box-shadow:0 2px 8px #0000001a;max-width:calc(100% - 24px)}
.statusbar .final{color:#c2410c;margin-left:8px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--panel);border-radius:14px;padding:12px;box-shadow:0 1px 2px #0000000d}
h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{margin:0 0 6px;font-size:18px}
.titlebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:16px}
.player{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;margin-bottom:2px}
.player.active{background:#f4f6f9;box-shadow:inset 3px 0 0 var(--pc)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none}
.pname{flex:1;font-weight:600;min-width:0}
.sub,.stats{font-size:11px;color:var(--muted);font-weight:400}
.stats{text-align:right}
.score{font-weight:700;font-size:17px;min-width:34px;text-align:right}
.market{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.tcard{position:relative;height:58px;border-radius:9px;border:1px solid #0000001f;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;transition:transform .1s;box-shadow:inset 0 0 0 3px #ffffff59,0 1px 2px #0002;overflow:hidden}
.tcard::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:3px;background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 8px);opacity:.45}
.tcard .ic{width:74%;height:auto;filter:drop-shadow(0 1px 0 #0003)}
.tcard .n{position:absolute;top:3px;right:4px;min-width:20px;height:20px;border-radius:10px;background:#fff;color:#1f2430;font-size:12px;line-height:20px;text-align:center;box-shadow:0 1px 2px #0003}
.tcard .lbl{position:absolute;top:3px;left:6px;font-size:9px;letter-spacing:.08em;opacity:.85}
.market .tcard:hover{transform:translateY(-2px)}
.tcard.disabled{opacity:.45;pointer-events:none}
.tcard.empty{background:#f1f3f6;border-style:dashed;cursor:default}
.c-red{background:#e5484d}.c-orange{background:#f76b15}.c-yellow{background:#f2c200}.c-green{background:#30a46c}
.c-blue{background:#3e7bfa}.c-purple{background:#8e4ec6}.c-black{background:#2f3136}.c-white{background:#f7f7f5;color:#4b5563}.c-yellow{color:#5c4600}
.c-wild{background:linear-gradient(135deg,#e5484d,#f2c200,#30a46c,#3e7bfa,#8e4ec6)}
.deck{background:repeating-linear-gradient(45deg,#334155 0 6px,#3d4b61 6px 12px);flex-direction:column;font-size:15px}.deck small{font-size:9px;letter-spacing:.1em;opacity:.8}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--accent);color:#fff}
.ghost{background:#eef1f5;color:var(--ink)}
.wide{width:100%}
.logcard{flex:1;min-height:120px;display:flex;flex-direction:column}
.log{flex:1;min-height:0;overflow:auto;font-size:12px;color:var(--muted)}
.log div{padding:2px 0;border-bottom:1px solid #f1f3f6}
.bottom{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
.hand{display:flex;gap:6px;flex-wrap:wrap}
.hand{flex-wrap:nowrap}.hand .tcard{flex:1 1 0;min-width:0;max-width:62px;height:76px;cursor:default}
.hand .tcard.zero{opacity:.25}
.tickets{display:flex;gap:6px;flex-wrap:wrap;max-height:120px;overflow:auto}
.ticket{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;background:#fffdf6;cursor:default}
.ticket b{margin-left:8px}
.ticket{display:flex;align-items:center;gap:8px}
.ticket .mm{width:58px;height:47px;border-radius:5px;flex:none;border:1px solid #0000001a}
.ticket .tt{flex:1;line-height:1.25}
.ticket.big .mm{width:96px;height:78px}
.ticket.long{background:linear-gradient(135deg,#fff4dc,#fde7b8);border-color:#e0a63a}
.ltag{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;color:#b45309;margin-bottom:1px}
.ticket.done{background:#e7f6ef;border-color:#9bd5b9}
.ticket.big{font-size:14px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;margin-bottom:8px;opacity:.55}
.ticket.big.sel{opacity:1;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.muted{color:var(--muted);margin:0 0 12px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;pointer-events:none}
.hidden{display:none}
.modal{background:#fff;border-radius:16px;padding:0 20px 20px;max-width:440px;width:100%;box-shadow:0 12px 48px #0004,0 0 0 1px #0000000f;max-height:90vh;overflow:auto;pointer-events:auto}
.grip{cursor:move;touch-action:none;user-select:none;text-align:center;color:#9aa3ae;font-size:11px;letter-spacing:.1em;padding:8px 0 10px;margin:0 -20px 4px;border-bottom:1px solid var(--line)}
.grip::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#d1d5db;margin:0 auto 4px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{flex:1}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.payopts button{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:6px;background:#f4f6f9}
.chip{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid #0002}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}
td,th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.route{cursor:pointer}
.route:hover rect{stroke:#1f2430;stroke-width:2}
.route.owned{cursor:default}
.fresh{animation:drop .45s cubic-bezier(.3,1.6,.6,1) both}
@keyframes drop{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
.city circle{fill:#fff;stroke:#334155;stroke-width:2.5}
.city.goal circle{stroke:#d97706;stroke-width:3.5;fill:#fff7e6}
.city circle{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.city.hl circle{fill:#fcd34d;stroke:#b45309;stroke-width:2.5;transform:scale(3.4);animation:hlpulse 1s ease-in-out infinite alternate}
@keyframes hlpulse{from{transform:scale(3);filter:drop-shadow(0 0 0 #f59e0b)}to{transform:scale(3.8);filter:drop-shadow(0 0 4px #f59e0b)}}
.city.hl text{font-size:20px;fill:#92400e}
.hl .lb-below{transform:translateY(16px)}.hl .lb-up{transform:translateY(-16px)}.hl .lb-end{transform:translateX(-20px)}.hl .lb-start{transform:translateX(20px)}
.city text{font-size:16px;font-weight:700;fill:#1f2937;paint-order:stroke;stroke:#fbf8f0;stroke-width:4.5px;stroke-linejoin:round;pointer-events:none}
.sea text{font-size:13px;font-style:italic;fill:#7fa3b8;letter-spacing:.1em}
@media (max-width:820px){.app{grid-template-columns:1fr;height:auto}.mapbox{height:85vw;flex:none}.bottom{grid-template-columns:1fr}.logcard{max-height:200px}}
</style>
</head>

    <div class="bottom">
      <div class="card"><h3>Your cards</h3><div id="hand" class="hand"></div></div>

</div>

["Reims","Lyon"],["Metz","Besançon"],["Strasbourg","Dijon"],["Rennes","Orléans"],["Le Mans","Limoges"],["Caen","Nantes"],["Amiens","Troyes"],["Bourges","Montpellier"],
["Clermont-Ferrand","Marseille"],["Limoges","Lourdes"],["La Rochelle","Toulouse"],["Biarritz","Carcassonne"],["Perpignan","Avignon"],["Grenoble","Montpellier"],
["Chamonix","Dijon"],["Mulhouse","Lyon"],["Rodez","Bordeaux"],["Poitiers","Clermont-Ferrand"],["Tours","Dijon"],["Orléans","Lille"],["Paris","Toulouse"],["Lyon","Nice"],

for(const k in MAPS)MAPS[k].id=k;
let MAP,CITIES,LABEL,LAND,LL,ROUTES,ADJ,TICKETS;
const XY=c=>LL(CITIES[c]);
const COLORS=["red","orange","yellow","green","blue","purple","black","white"];
const HEX={red:"#e5484d",orange:"#f76b15",yellow:"#f2c200",green:"#30a46c",blue:"#3e7bfa",purple:"#8e4ec6",black:"#2f3136",white:"#f7f7f5",gray:"#b9bfc8"};
const PTS=[0,1,2,4,7,10,15];
const PCOL=["#12a594","#d6409f","#a1662f","#5b5bd6"];
const LEVELS=["Easy","Medium","Hard"];
const BOT_NAMES=["Mei","Kenji","Arun"];

function useMap(id){if(MAP===MAPS[id])return;MAP=MAPS[id];({cities:CITIES,labels:LABEL,land:LAND}=MAP);
  const[lo,la,sx,sy]=MAP.proj;LL=([lon,lat])=>[(lon-lo)*sx,(la-lat)*sy];ROUTES=[];
  for(const [a,b,...cols] of MAP.routes){const f=ROUTES.length,[x1,y1]=XY(a),[x2,y2]=XY(b);
    const len=Math.max(1,Math.min(6,Math.round(Math.hypot(x2-x1,y2-y1)/42)));
    cols.forEach((color,i)=>ROUTES.push({id:ROUTES.length,a,b,color,len,pair:cols.length>1?f+1-i:-1,off:cols.length>1?(i?5.5:-5.5):0}))}
  ADJ={};for(const c in CITIES)ADJ[c]=[];ROUTES.forEach(r=>{ADJ[r.a].push(r);ADJ[r.b].push(r)});
  // ticket value = shortest possible route in trains
  TICKETS=[...MAP.tickets.map(d=>[...d,false]),...MAP.long.map(d=>[...d,true])].map(([a,b,long])=>({a,b,long,pts:shortest(a,b,r=>r.len).cost}));
  buildMap();setVB(0,0,W)}

// ponytail: O(V^2) Dijkstra, fine for 44 cities
function shortest(a,b,w){const d={},prev={},done=new Set();for(const c in CITIES)d[c]=Infinity;d[a]=0;
  for(;;){let u=null;for(const c in d)if(!done.has(c)&&(u===null||d[c]<d[u]))u=c;if(u===null||d[u]===Infinity||u===b)break;done.add(u);
    for(const r of ADJ[u]){const wt=w(r);if(wt===Infinity)continue;const v=r.a===u?r.b:r.a;if(d[u]+wt<d[v]){d[v]=d[u]+wt;prev[v]=r}}}
  if(d[b]===Infinity)return{cost:Infinity,routes:[]};const routes=[];for(let c=b;c!==a;){const r=prev[c];routes.push(r.id);c=r.a===c?r.b:r.a}
  return{cost:d[b],routes}}


// ---------- Helpers ----------
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const cardCount=p=>Object.values(p.hand).reduce((a,b)=>a+b,0);
let G=null,SIM=false,timer=null,ME=0,NET=null; // ME = this browser's seat; NET = online room (see Online)
const cur=()=>G.players[G.cur];
const human=()=>G.players[ME];
function log(m){G.log.unshift(m);if(G.log.length>80)G.log.pop()}

// ---------- Rules ----------
function newGame(setup,map=MAP.id){clearTimeout(timer);useMap(map);
  G={map,players:setup.map((s,i)=>({...s,i,color:PCOL[i],hand:Object.fromEntries([...COLORS,"wild"].map(c=>[c,0])),trains:45,tickets:[],score:0})),
    deck:shuffle([...COLORS.flatMap(c=>Array(12).fill(c)),...Array(14).fill("wild")]),discard:[],faceUp:Array(5).fill(null),
    tdeck:shuffle(TICKETS.map((_,i)=>i).filter(i=>!TICKETS[i].long)),ldeck:shuffle(TICKETS.map((_,i)=>i).filter(i=>TICKETS[i].long)),owner:ROUTES.map(()=>null),cur:0,drawn:0,finalLeft:-1,passes:0,log:[],over:false,pending:null};
  for(const p of G.players)for(let k=0;k<4;k++)p.hand[drawDeck()]++;
  refill();
  const q=[];for(const p of G.players){const offered=[G.ldeck.pop(),...G.tdeck.splice(-2)]; // 1 long + 2 regular
    if(p.bot){p.tickets=chooseTickets(p,offered,2);G.tdeck.unshift(...offered.filter(t=>!p.tickets.includes(t)&&!TICKETS[t].long))}
    else q.push({p:p.i,offered,min:2,initial:true})}
  G.pendQ=q;G.pending=q.shift()||null; // humans pick their starting tickets one after another
  log("New game. Everyone picks destination tickets.");
  render();if(G.pending?.p===ME&&!SIM)showTickets();else schedule()}

function drawDeck(){if(!G.deck.length){G.deck=shuffle(G.discard);G.discard=[]}return G.deck.pop()||null}
function refill(){for(let t=0;t<4;t++){for(let i=0;i<5;i++)if(!G.faceUp[i])G.faceUp[i]=drawDeck();
  if(t===3||G.faceUp.filter(c=>c==="wild").length<3)return;
  log("Three wilds face-up: market reshuffled.");G.discard.push(...G.faceUp.filter(Boolean));G.faceUp=Array(5).fill(null)}}
const canDrawAny=second=>G.deck.length||G.discard.length||G.faceUp.some(c=>c&&(!second||c!=="wild"));

function takeFace(i){const c=G.faceUp[i];if(!c||(c==="wild"&&G.drawn))return false;const p=cur();
  p.hand[c]++;G.faceUp[i]=null;refill();sfx(c==="wild"?"wild":"card");log(`${p.name} took a face-up ${c==="wild"?"wild":c} card.`);afterDraw(c==="wild");return true}
function takeDeck(){const c=drawDeck();if(!c)return false;const p=cur();p.hand[c]++;sfx("card");
  log(p.bot||NET?`${p.name} drew from the deck.`:`You drew a ${c} card from the deck.`);if(p===human())toast(`You drew: ${c}`)
  afterDraw(false);return true}
function afterDraw(wild){G.passes=0;G.drawn++;if(wild||G.drawn>=2||!canDrawAny(true))endTurn();else render()}

function free(r,p){if(G.owner[r.id]!==null)return false;if(r.pair<0)return true;const o=G.owner[r.pair];
  return o===null||(o!==p.i&&G.players.length>3)} // doubles: both usable only with 4 players, never both by one player
const routeOk=(r,p)=>free(r,p)&&p.trains>=r.len;
function payOptions(r,p){const o=(r.color==="gray"?COLORS:[r.color]).filter(c=>p.hand[c]&&p.hand[c]+p.hand.wild>=r.len);
  if(p.hand.wild>=r.len)o.push("wild");return o}
function claim(rid,c){const r=ROUTES[rid],p=cur();if(!r||G.drawn||!routeOk(r,p)||!payOptions(r,p).includes(c))return false;
  const n=c==="wild"?0:Math.min(p.hand[c],r.len);p.hand[c]-=n;p.hand.wild-=r.len-n;
  G.discard.push(...Array(n).fill(c),...Array(r.len-n).fill("wild"));
  const before=p.tickets.filter(t=>connected(p,TICKETS[t].a,TICKETS[t].b));G.owner[rid]=p.i;G.lastClaim={rid,at:Date.now()};p.trains-=r.len;p.score+=PTS[r.len];G.passes=0;
  sfx("claim",r.len);fxClaim(r,p.i);
  if(p===human())p.tickets.filter(t=>!before.includes(t)&&connected(p,TICKETS[t].a,TICKETS[t].b)).forEach((t,i)=>{
    sfx("done",0,r.len*.14+.5+i*1.4);if(!SIM)setTimeout(()=>fxTicket(t),r.len*140+500+i*1400)});
  log(`${p.name} claimed ${r.a} – ${r.b} (+${PTS[r.len]}).`);endTurn();return true}

function drawTickets(){if(G.drawn||G.pending||!G.tdeck.length)return false;const p=cur();
  G.pending={p:p.i,offered:G.tdeck.splice(-3).reverse(),min:1};log(`${p.name} drew destination tickets.`);sfx("ticket");
  if(p.bot)keepTickets(chooseTickets(p,G.pending.offered,1));else{render();if(p===human())showTickets()}return true}
function keepTickets(keep){const pd=G.pending,p=G.players[pd.p];G.pending=null;p.tickets.push(...keep);
  G.tdeck.unshift(...pd.offered.filter(t=>!keep.includes(t)&&!TICKETS[t].long));
  if(pd.initial){G.pending=G.pendQ?.shift()||null;if(!G.pending)log(G.players[0]===human()&&!NET?"You go first.":`${G.players[0].name} goes first.`);
    render();if(G.pending?.p===ME)showTickets();else schedule();return}
  log(`${p.name} kept ${keep.length} ticket${keep.length>1?"s":""}.`);G.passes=0;endTurn()}

function endTurn(){const p=cur();G.drawn=0;
  if(G.finalLeft>0){if(--G.finalLeft===0)return finish()}
  else if(G.finalLeft<0&&p.trains<=2){G.finalLeft=G.players.length;log(`${p.name} is down to ${p.trains} trains: everyone gets one final turn!`);sfx("final")}
  if(G.passes>=G.players.length*2)return finish(); // nobody can move
  G.cur=(G.cur+1)%G.players.length;if(cur()===human())sfx("turn",0,.6);render();schedule()}
function pass(){G.passes++;log(`${cur().name} passed.`);endTurn()}
function schedule(){if(SIM||G.over||G.pending||NET&&!NET.host)return;clearTimeout(timer);if(cur().bot)timer=setTimeout(()=>botTurn(cur()),850)}

function connected(p,a,b){const seen=new Set([a]),q=[a];while(q.length){const c=q.pop();if(c===b)return true;
  for(const r of ADJ[c])if(G.owner[r.id]===p.i){const n=r.a===c?r.b:r.a;if(!seen.has(n)){seen.add(n);q.push(n)}}}return false}
// ponytail: brute-force trail search, fine for <=45 trains per player
function longest(p){const mine=ROUTES.filter(r=>G.owner[r.id]===p.i),used=new Set();let best=0;
  const dfs=(c,len)=>{if(len>best)best=len;for(const r of mine)if(!used.has(r.id)&&(r.a===c||r.b===c)){used.add(r.id);dfs(r.a===c?r.b:r.a,len+r.len);used.delete(r.id)}};
  for(const c of new Set(mine.flatMap(r=>[r.a,r.b])))dfs(c,0);return best}
function finish(){G.over=true;clearTimeout(timer);const L=G.players.map(longest),max=Math.max(...L);
  G.results=G.players.map((p,i)=>{const done=p.tickets.filter(t=>connected(p,TICKETS[t].a,TICKETS[t].b));
    const plus=done.reduce((s,t)=>s+TICKETS[t].pts,0),minus=p.tickets.filter(t=>!done.includes(t)).reduce((s,t)=>s+TICKETS[t].pts,0);
    const bonus=max>0&&L[i]===max?10:0;return{p,routes:p.score,plus,minus,bonus,long:L[i],done:done.length,total:p.score+plus-minus+bonus}})
    .sort((a,b)=>b.total-a.total||b.done-a.done||b.long-a.long);
  log(`Game over. ${G.results[0].p.name} wins!`);sfx(G.results[0].p===human()?"win":"lose",0,.4);render();if(!SIM)showEnd()}

// ---------- Bots ----------
// All levels plan shortest paths for their tickets and collect matching cards.
// Easy: random moves 30% of the time, sloppy card picks, keeps random tickets, never takes extra tickets.
// Medium: random moves 12% of the time, keeps tickets up to ~60% of its trains.
// Hard: never random, keeps only tickets it can comfortably finish (~40% of trains), reusing its network.
// ponytail: bottleneck-first and wild-grabbing were tried and lost in simulate(); add back only if they measurably win.
const RANDOM=[.3,.12,0];
const wFor=p=>r=>G.owner[r.id]===p.i?0:free(r,p)?r.len:Infinity;
function makePlan(p){const w=wFor(p),need=new Map();let open=0;
  for(const t of p.tickets){const T=TICKETS[t];if(connected(p,T.a,T.b))continue;const s=shortest(T.a,T.b,w);if(s.cost>p.trains)continue;open++;
    for(const rid of s.routes)if(G.owner[rid]===null)need.set(rid,(need.get(rid)||0)+ROUTES[rid].len)}
  return{need,open}}
function chooseTickets(p,offered,min){const L=p.level;
  if(L===0)return shuffle([...offered]).slice(0,Math.min(offered.length,min+(Math.random()<.3?1:0)));
  const w=wFor(p),used=new Set();let budget=p.trains*(L===2?.4:.6);
  for(const rid of makePlan(p).need.keys()){used.add(rid);budget-=ROUTES[rid].len}
  const extra=x=>x.s.cost===Infinity?999:x.s.routes.filter(id=>!used.has(id)&&G.owner[id]===null).reduce((a,id)=>a+ROUTES[id].len,0);
  const rest=offered.map(t=>({t,s:shortest(TICKETS[t].a,TICKETS[t].b,w)})),keep=[];
  while(rest.length){rest.sort((a,b)=>extra(a)-extra(b));
    const x=rest[0],e=extra(x);if(keep.length>=min&&e>budget)break;keep.push(x.t);rest.shift();budget-=e;x.s.routes.forEach(id=>used.add(id))}
  return keep}
function botTurn(p){if(G.over||G.pending||cur()!==p)return;
  const L=p.level,plan=makePlan(p),afford=r=>routeOk(r,p)&&payOptions(r,p).length>0;
  const anyAfford=()=>ROUTES.filter(afford).sort((a,b)=>b.len-a.len);
  const endgame=G.finalLeft>0||G.players.some(q=>q.trains<=3);
  if(Math.random()<RANDOM[L]){const a=anyAfford();return a.length&&Math.random()<.5?botClaim(p,pick(a)):botDraw(p,new Set())}
  const c=[...plan.need.keys()].map(i=>ROUTES[i]).filter(afford).sort((a,b)=>plan.need.get(b.id)-plan.need.get(a.id));
  if(c.length)return botClaim(p,c[0]);
  if(!plan.open&&!endgame&&L>0&&p.trains>=18&&G.tdeck.length)return drawTickets();
  const a=anyAfford();
  if(a.length&&(endgame||(!plan.open&&a[0].len>=2)||!canDrawAny()))return botClaim(p,a[0]);
  botDraw(p,wants(p,plan.need))}
function wants(p,need){const w=new Set();for(const rid of need.keys()){const r=ROUTES[rid];
  w.add(r.color==="gray"?COLORS.reduce((a,c)=>p.hand[c]>p.hand[a]?c:a):r.color)}return w}
function botClaim(p,r){const o=payOptions(r,p).sort((x,y)=>(y==="wild"?-1:p.hand[y])-(x==="wild"?-1:p.hand[x]));claim(r.id,o[0])}
function botDraw(p,want){if(!canDrawAny()){const a=ROUTES.filter(r=>routeOk(r,p)&&payOptions(r,p).length);return a.length?botClaim(p,a[0]):pass()}
  botPick(p,want,true);if(!G.over&&cur()===p&&G.drawn===1)botPick(p,want,false)||endTurn()}
function botPick(p,want,first){const F=G.faceUp,ok=i=>F[i]&&(first||F[i]!=="wild");
  let i=F.findIndex((c,j)=>ok(j)&&c!=="wild"&&want.has(c));
  if(p.level===0&&Math.random()<.4){const o=[0,1,2,3,4].filter(ok);if(o.length)i=pick(o)}
  if(i>=0)return takeFace(i);if(takeDeck())return true;
  i=[0,1,2,3,4].find(ok);return i!==undefined&&takeFace(i)}

// Self-check: all-bot games must end and score sanely. Run simulate() in the console.
function simulate(n=30,levels=[0,1,2,2],map=MAP.id){SIM=true;const wins=[0,0,0,0],totals=[0,0,0,0];
  try{for(let g=0;g<n;g++){newGame(levels.map((l,i)=>({name:"B"+i+LEVELS[l],bot:true,level:l})),map);let k=0;
    while(!G.over&&k++<5000)botTurn(cur());console.assert(G.over,"game did not end");
    console.assert(G.players.every(p=>p.trains>=0&&Object.values(p.hand).every(v=>v>=0)),"negative stock");
    console.assert(G.players.every(p=>p.tickets.filter(t=>TICKETS[t].long).length<=1)&&!G.tdeck.some(t=>TICKETS[t].long),"long ticket leaked");
    console.assert(G.deck.length+G.discard.length+G.faceUp.filter(Boolean).length+G.players.reduce((s,p)=>s+cardCount(p),0)===110,"card leak");
    wins[G.results[0].p.i]++;G.results.forEach(r=>totals[r.p.i]+=r.total)}}
  finally{SIM=false;G=null}return{wins,avg:totals.map(t=>Math.round(t/n))}}

// ---------- Sound (synthesized with Web Audio, no files) ----------
let AC=null,muted=false;try{muted=localStorage.getItem("jr-muted")==="1"}catch{}
function tone(f,t,dur,{type="sine",vol=.12,to}={}){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}
function noise(t,dur,{vol=.2,freq=1200,q=1}={}){const b=AC.createBuffer(1,AC.sampleRate*dur|0,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  n.buffer=b;fl.type="bandpass";fl.frequency.value=freq;fl.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  n.connect(fl).connect(g).connect(AC.destination);n.start(t)}
const SFX={
  card:t=>noise(t,.12,{vol:.3,freq:3200,q:.7}),                                   // card swish
  wild:t=>[660,880,1320].forEach((f,i)=>tone(f,t+i*.06,.3,{type:"triangle",vol:.08})),
  claim:(t,n)=>{for(let i=0;i<n;i++){noise(t+i*.14,.08,{vol:.45,freq:450,q:1.4});noise(t+i*.14+.07,.06,{vol:.25,freq:900})} // chugs, one per car
    tone(740,t+n*.14,.45,{type:"square",vol:.035});tone(932,t+n*.14,.45,{type:"square",vol:.035})},                      // whistle
  ticket:t=>{noise(t,.2,{vol:.15,freq:5000,q:.5});noise(t+.13,.16,{vol:.12,freq:4200,q:.5})},
  done:t=>{tone(1047,t,.15,{vol:.1});tone(1568,t+.09,.35,{vol:.1})},             // ticket completed
  turn:t=>{tone(784,t,.18,{vol:.09});tone(1047,t+.12,.3,{vol:.09})},
  final:t=>[0,.4,.8].forEach(d=>{tone(523,t+d,.7,{type:"triangle",vol:.1});tone(1046,t+d,.5,{vol:.03})}),
  win:t=>[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.14,i===3?.8:.35,{type:"triangle",vol:.12})),
  lose:t=>[392,349,294].forEach((f,i)=>tone(f,t+i*.22,.5,{type:"triangle",vol:.1})),
  error:t=>tone(220,t,.15,{type:"square",vol:.04,to:150})};
function sfx(name,arg,delay=0){if(SIM||muted)return;try{AC=AC||new AudioContext();if(AC.state==="suspended")AC.resume();SFX[name](AC.currentTime+.02+delay,arg)}catch{}}

// ---------- Map effects ----------
function fxAdd(html,ms){if(SIM)return;const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.innerHTML=html;$("fx").appendChild(g);setTimeout(()=>g.remove(),ms)}
const segLine=(r,cls,col)=>{const[x1,y1]=XY(r.a),[x2,y2]=XY(r.b);return`<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}"/>`};
function fxClaim(r,o){const[x1,y1]=XY(r.a),[x2,y2]=XY(r.b);
  fxAdd(segLine(r,"fx-glow",PCOL[o])+`<text class="fx-pts" x="${(x1+x2)/2}" y="${(y1+y2)/2-14}" fill="${PCOL[o]}">+${PTS[r.len]}</text>`,1700)}
function ownedPath(p,a,b){const prev={[a]:null},q=[a];
  while(q.length){const c=q.shift();if(c===b)break;for(const r of ADJ[c])if(G.owner[r.id]===p.i){const n=r.a===c?r.b:r.a;if(!(n in prev)){prev[n]=r;q.push(n)}}}
  const out=[];for(let c=b;prev[c];){const r=prev[c];out.push(r);c=r.a===c?r.b:r.a}return out}
function fxTicket(t){const T=TICKETS[t];
  fxAdd(ownedPath(human(),T.a,T.b).map(r=>segLine(r,"fx-path","#f5b301")).join("")+
    [T.a,T.b].map(c=>{const[x,y]=XY(c);return`<circle class="fx-ring" cx="${x}" cy="${y}" r="10"/><circle class="fx-ring" style="animation-delay:.45s" cx="${x}" cy="${y}" r="10"/>`}).join(""),3500);
  const cols=[...PCOL,...COLORS.map(c=>HEX[c])],b=document.createElement("div");b.className="banner";
  b.innerHTML=`<div class="bt">Destination complete!</div><div>${T.a} → ${T.b}</div><b>+${T.pts}</b>`+Array.from({length:40},(_,i)=>
    `<i style="--x:${(Math.random()*2-1)*240}px;--y:${-40-Math.random()*180}px;--r:${Math.random()*720}deg;background:${cols[i%cols.length]};animation-delay:${Math.random()*.15}s"></i>`).join("");
  document.body.appendChild(b);setTimeout(()=>b.remove(),3500)}

// ---------- Map zoom (trackpad scroll / pinch / wheel) and drag to pan ----------
const svgEl=$("map");let VB=[0,0,W,H],panMoved=false;
function setVB(x,y,w){const h=w*H/W;VB=[Math.min(Math.max(0,x),W-w),Math.min(Math.max(0,y),H-h),w,h];svgEl.setAttribute("viewBox",VB.join(" "))}
function zoomAt(cx,cy,f){const nw=Math.min(W,Math.max(W/6,VB[2]*f));f=nw/VB[2];
  const p=new DOMPoint(cx,cy).matrixTransform(svgEl.getScreenCTM().inverse());setVB(p.x-(p.x-VB[0])*f,p.y-(p.y-VB[1])*f,nw)}
svgEl.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*(e.ctrlKey?.01:.0025)))},{passive:false});
const ptrs=new Map();let pinch=null,start=null;
svgEl.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);start=[e.clientX,e.clientY];panMoved=false;pinch=null});
addEventListener("pointermove",e=>{const prev=ptrs.get(e.pointerId);if(!prev)return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,pinch/d);pinch=d;panMoved=true;return}
  if(!panMoved&&Math.hypot(e.clientX-start[0],e.clientY-start[1])<5)return;   // small jitter still counts as a click
  panMoved=true;const s=1/svgEl.getScreenCTM().a;setVB(VB[0]-(e.clientX-prev[0])*s,VB[1]-(e.clientY-prev[1])*s,VB[2])});
const endPtr=e=>{ptrs.delete(e.pointerId);pinch=null};addEventListener("pointerup",endPtr);addEventListener("pointercancel",endPtr);
document.querySelector(".zoomctl").onclick=e=>{const z=+e.target.dataset.z;if(isNaN(z))return;
  if(!z)return setVB(0,0,W);const b=svgEl.getBoundingClientRect();zoomAt(b.left+b.width/2,b.top+b.height/2,z)};

// ---------- Save / resume (browser storage, autosaved on every change) ----------
function save(){if(SIM||!G||NET)return;try{G.over?localStorage.removeItem("jr-save"):localStorage.setItem("jr-save",JSON.stringify(G))}catch{}}
function loadSave(){try{const g=JSON.parse(localStorage.getItem("jr-save"));return g&&!g.over?g:null}catch{return null}}
function resume(g){clearTimeout(timer);useMap(g.map||"asia");G=g;closeOv();render();if(G.pending&&G.pending.p===0)showTickets();else schedule()}

// ---------- Online (PeerJS: browsers connect directly, the public PeerJS server only introduces them) ----------
// The host's browser runs the game and the bots. Guests send their moves to the host and get the whole state back after every change.
// ponytail: host tab must stay open (closing it ends the game); move the game into a Cloudflare Durable Object if that ever hurts.
const ROOM=(new URLSearchParams(location.search).get("room")||"").toUpperCase().slice(0,4);
const ACTIONS={takeFace,takeDeck,claim,drawTickets,pass,keepTickets};
let ticketsOpen=false;
function act(a,...args){if(NET&&!NET.host)return NET.conn.send({a,args});ACTIONS[a](...args)}
const loadPeer=()=>window.Peer?Promise.resolve():new Promise((ok,err)=>{const s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js";s.onload=ok;s.onerror=()=>err(toast("Can't load the online library. Are you offline?"));document.head.appendChild(s)});
function leaveNet(){if(NET){const n=NET;NET=null;ME=0;n.peer.destroy()}}
const lobbyNames=()=>[NET.name,...[...NET.conns.keys()].map(c=>c.nm)];
const lobbyHTML=names=>names.map((n,i)=>`<div class="player" style="--pc:${PCOL[i]}"><span class="dot"></span><div class="pname">${n}${i?"":" <span class='sub'>host</span>"}</div></div>`).join("");
function lobbyUpdate(){const names=lobbyNames();if($("lobbyList"))$("lobbyList").innerHTML=lobbyHTML(names);for(const c of NET.conns.keys())c.send({lobby:names})}
function broadcast(){if(NET?.host&&NET.started)for(const[c,seat]of NET.conns)if(seat!==null&&c.open)c.send({G,me:seat})}

async function hostRoom(name,map){await loadPeer();leaveNet();
  const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join(""),peer=new Peer("jade-rails-"+code);
  NET={host:true,peer,code,name,conns:new Map(),started:false};
  peer.on("error",e=>toast(e.type==="unavailable-id"?"Room code taken, try again.":"Online error: "+e.type));
  peer.on("open",()=>{const link=location.href.split(/[?#]/)[0]+"?room="+code;
    ov(`<h2>Room ${code}</h2><p class="muted">Friends open the game and join with this code, or open the link. Keep this tab open: your browser runs the game.</p>
      <div class="row"><input readonly value="${link}" style="flex:1;min-width:0"><button class="ghost" id="copyBtn">Copy link</button></div>
      <h3>Players</h3><div id="lobbyList" style="margin-bottom:12px"></div>
      <div class="row"><label for="mp">Map</label><select id="mp">${Object.values(MAPS).map(m=>`<option value="${m.id}" ${m.id===map?"selected":""}>${m.name}</option>`).join("")}</select></div>
      <h3>Add bots</h3>${botRows(false)}<button class="primary wide" id="goBtn">Start game</button>`);
    lobbyUpdate();$("copyBtn").onclick=()=>navigator.clipboard.writeText(link).then(()=>toast("Link copied"));
    $("goBtn").onclick=()=>{const guests=[...NET.conns.keys()],bots=pickBots();
      if(!guests.length&&!bots.length)return toast("Wait for a friend to join, or add a bot.");if(guests.length+bots.length>3)return toast("4 players max.");
      guests.forEach((c,i)=>NET.conns.set(c,i+1));NET.started=true;closeOv();ME=0;
      newGame([{name,bot:false},...guests.map(c=>({name:c.nm,bot:false})),...bots],$("mp").value)}});
  peer.on("connection",conn=>conn.on("open",()=>{if(NET?.peer!==peer)return conn.close();const nm=clean(conn.metadata?.name),refuse=m=>{conn.send({err:m});setTimeout(()=>conn.close(),500)};
    if(NET.started){ // same name can take back a seat that lost its connection
      const taken=new Set(NET.conns.values()),seat=G.players.findIndex((p,i)=>i&&!p.bot&&p.name===nm&&!taken.has(i));
      if(seat<0)return refuse("That game has already started.");conn.nm=nm;NET.conns.set(conn,seat);toast(`${nm} rejoined`);conn.send({G,me:seat})}
    else{if(NET.conns.size>=3)return refuse("The room is full.");let n=nm,k=2;while(lobbyNames().includes(n))n=nm.slice(0,10)+k++;
      conn.nm=n;NET.conns.set(conn,null);lobbyUpdate()}
    conn.on("data",m=>{const seat=NET?.conns.get(conn);if(seat)onAction(seat,m)});
    conn.on("close",()=>{if(NET?.peer!==peer)return;NET.conns.delete(conn);toast(`${conn.nm} left`);if(!NET.started)lobbyUpdate()})}))}
// Host side: a guest may only act on its own turn (or its own ticket choice), with arguments the rules accept.
function onAction(seat,m){if(!G||G.over||!m||!Object.hasOwn(ACTIONS,m.a)||!Array.isArray(m.args))return;const pd=G.pending;
  if(pd?pd.p!==seat||m.a!=="keepTickets":G.cur!==seat||m.a==="keepTickets")return;
  if(pd){const k=m.args[0];if(!Array.isArray(k)||new Set(k).size!==k.length||k.length<pd.min||!k.every(t=>pd.offered.includes(t)))return}
  ACTIONS[m.a](...m.args)}

async function joinRoom(code,name){await loadPeer();leaveNet();const peer=new Peer();NET={host:false,peer,code};
  peer.on("error",e=>{toast(e.type==="peer-unavailable"?`Room ${code} not found.`:"Online error: "+e.type)});
  peer.on("open",()=>{const conn=peer.connect("jade-rails-"+code,{metadata:{name},serialization:"json",reliable:true});NET.conn=conn;
    conn.on("open",()=>ov(`<h2>Room ${code}</h2><p class="muted">Joined. Waiting for the host to start the game…</p><div id="lobbyList"></div>`));
    conn.on("data",m=>{if(m.err){toast(m.err);leaveNet()}else if(m.lobby){if($("lobbyList"))$("lobbyList").innerHTML=lobbyHTML(m.lobby)}else if(m.G)receive(m.G,m.me)});
    conn.on("close",()=>{if(NET?.conn===conn){toast("Disconnected from the host.");leaveNet()}})})}
// Guest side: swap in the host's state and replay the sounds and effects the host saw.
function receive(g,me){const prev=NET.live?G:null,myDone=()=>human().tickets.filter(t=>connected(human(),TICKETS[t].a,TICKETS[t].b));
  const before=prev?myDone():[];ME=me;useMap(g.map);G=g;NET.live=true;if(!prev){clearTimeout(timer);ticketsOpen=false;closeOv()}
  const lc=G.lastClaim;if(lc&&lc.at!==NET.lastAt){NET.lastAt=lc.at;if(prev){lc.at=Date.now();const r=ROUTES[lc.rid];fxClaim(r,G.owner[r.id]);sfx("claim",r.len)}}
  render();if(!prev)return G.pending?.p===ME&&showTickets();
  myDone().filter(t=>!before.includes(t)).forEach((t,i)=>setTimeout(()=>{sfx("done");fxTicket(t)},1200+i*1400));
  if(G.cur===ME&&prev.cur!==ME&&!G.over)sfx("turn",0,.6);
  if(G.pending?.p===ME&&!ticketsOpen)showTickets();
  if(G.over&&!prev.over){sfx(G.results[0].p.i===ME?"win":"lose",0,.4);showEnd()}}

// ---------- UI ----------
const overlay=$("overlay");
// Pop-ups float without a backdrop and can be dragged by the grip; the position sticks between pop-ups.
let dragXY=[0,0];
function ov(html){overlay.innerHTML=`<div class="modal"><div class="grip">DRAG TO MOVE</div>${html}</div>`;overlay.classList.remove("hidden");
  const m=overlay.firstChild,place=()=>m.style.translate=`${dragXY[0]}px ${dragXY[1]}px`;place();
  m.firstChild.onpointerdown=e=>{e.preventDefault();const sx=e.clientX-dragXY[0],sy=e.clientY-dragXY[1];
    const mv=ev=>{dragXY=[ev.clientX-sx,ev.clientY-sy];place()},up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up)};
    addEventListener("pointermove",mv);addEventListener("pointerup",up)}}
const card=(c,inner)=>`<svg class="ic" viewBox="0 0 64 36"><use href="#${c==="wild"?"loco":"car"}"/></svg>${inner||""}`;
// destination ticket: mini map with both cities and a dashed line between them
function ticketHTML(t,cls){const T=TICKETS[t],[x1,y1]=XY(T.a),[x2,y2]=XY(T.b);
  return`<div class="ticket ${cls}${T.long?" long":""}" data-t="${t}"><svg class="mm" viewBox="0 0 ${W} ${H}"><use href="#mini"/>
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#b45309" stroke-width="20" stroke-dasharray="40 26" stroke-linecap="round"/>
    <circle cx="${x1}" cy="${y1}" r="52" fill="#e5484d" stroke="#fff" stroke-width="16"/><circle cx="${x2}" cy="${y2}" r="52" fill="#e5484d" stroke="#fff" stroke-width="16"/></svg>
    <span class="tt">${T.long?`<span class="ltag">LONG ROUTE</span>`:""}${cls.includes("done")?"✓ ":""}${T.a} →<br>${T.b}</span><b>${T.pts}</b></div>`}
const closeOv=()=>overlay.classList.add("hidden");
const nope=m=>{sfx("error");toast(m)};
let toastT;function toast(m){if(SIM)return;const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800)}
function hl(t){document.querySelectorAll(".city").forEach(g=>{const on=t!==null&&(g.dataset.city===TICKETS[t].a||g.dataset.city===TICKETS[t].b);g.classList.toggle("hl",on);if(on)g.parentNode.appendChild(g)})}

function buildMap(){const poly=pts=>pts.map(p=>LL(p).map(v=>v.toFixed(1)).join(",")).join(" ");
  const M=MAP,grid=[...M.grid[0].map(lon=>{const[x]=LL([lon,0]);return`<line x1="${x}" y1="0" x2="${x}" y2="${H}"/>`}),
    ...M.grid[1].map(lat=>{const[,y]=LL([0,lat]);return`<line x1="0" y1="${y}" x2="${W}" y2="${y}"/>`})];
  const[cx,cy]=LL(M.compass),land=LAND.map(p=>`<polygon points="${poly(p)}"/>`).join(""),fill=(ps,f)=>ps.map(p=>f(poly(p))).join("");
  $("map").innerHTML=`<defs>
    <radialGradient id="sea" cx="70%" cy="70%" r="90%"><stop offset="0" stop-color="#c4ddec"/><stop offset="1" stop-color="#dcebf3"/></radialGradient>
    <linearGradient id="land" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="832"><stop offset="0" stop-color="#eef0e1"/><stop offset=".45" stop-color="#f7f1e2"/><stop offset="1" stop-color="#e3eed6"/></linearGradient>
    <pattern id="mtn" width="22" height="16" patternUnits="userSpaceOnUse"><path d="M2 13 L7 5 L12 13 M10 13 L15 7 L20 13" fill="none" stroke="#b9a587" stroke-width="1.2"/></pattern>
    <pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r="1" fill="#d6bf8f"/><circle cx="7" cy="8" r=".8" fill="#d6bf8f"/></pattern>
    <filter id="carshadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="1.2" stdDeviation=".7" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4a6b80" flood-opacity=".25"/></filter>
    <clipPath id="landclip">${land}</clipPath><symbol id="mini" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#d5e7f1"/><g fill="#efe8d6">${land}</g></symbol></defs>
    <rect width="${W}" height="${H}" fill="url(#sea)"/>
    <g stroke="#ffffff" stroke-opacity=".6" stroke-width="1" stroke-dasharray="2 5">${grid.join("")}</g>
    <g fill="none" stroke="#bfd8e8" stroke-width="14" stroke-linejoin="round">${land}</g>
    <g filter="url(#shadow)" fill="url(#land)" stroke="#c9bda4" stroke-width="1.2" stroke-linejoin="round">${land}</g>
    <g clip-path="url(#landclip)">${fill(M.mtn,p=>`<polygon points="${p}" fill="#e7dcc6" opacity=".9"/><polygon points="${p}" fill="url(#mtn)" opacity=".8"/>`)}
      ${fill(M.sand,p=>`<polygon points="${p}" fill="#f1e4c3" opacity=".9"/><polygon points="${p}" fill="url(#sand)"/>`)}
      <g fill="none" stroke="#8fbfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${fill(M.rivers,p=>`<polyline points="${p}"/>`)}</g>
      <g fill="none" stroke="#a8927a" stroke-width="2" stroke-dasharray="8 4 2 4" opacity=".6">${fill(M.border||[],p=>`<polyline points="${p}"/>`)}</g></g>
    <g font-size="15" font-weight="700" letter-spacing=".35em" fill="#a89c84" opacity=".55" text-anchor="middle">${M.countries.map(([n,p])=>{const[x,y]=LL(p);return`<text x="${x}" y="${y}">${n}</text>`}).join("")}</g>
    <g transform="translate(${cx} ${cy})" opacity=".75"><circle r="26" fill="#ffffff80" stroke="#7fa3b8"/><path d="M0 -22 L5 0 L0 22 L-5 0Z" fill="#7fa3b8"/><path d="M-22 0 L0 -5 L22 0 L0 5Z" fill="#a9c3d2"/><text y="-30" text-anchor="middle" font-size="11" font-weight="700" fill="#5b7f95">N</text></g>
    <g class="sea">${M.seas.map(([n,p])=>{const[x,y]=LL(p);return`<text x="${x}" y="${y}" text-anchor="middle">${n}</text>`}).join("")}</g><g id="routes"></g><g id="cities">`+
    Object.keys(CITIES).map(c=>{const[x,y]=XY(c);return`<g class="city" data-city="${c}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="7"/><text class="lb-${LABEL[c]?(LABEL[c][2]==="middle"?"up":LABEL[c][2]):"below"}" x="${(LABEL[c]||[0])[0]}" y="${(LABEL[c]||[0,21])[1]}" text-anchor="${(LABEL[c]||[0,0,"middle"])[2]}">${c}</text></g>`}).join("")+`</g><g id="fx"></g>`}

// Unclaimed routes are flat colored slots; claimed ones carry train-car pieces in the owner's color (locomotive first).
function routeSVG(r){const[x1,y1]=XY(r.a),[x2,y2]=XY(r.b),dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d,ox=-uy*r.off,oy=ux*r.off;
  const a=Math.atan2(dy,dx)*180/Math.PI,ang=(Math.abs(a)>90?a+180:a).toFixed(1); // keep cars wheels-down
  const pad=9,seg=(d-2*pad)/r.len,cl=seg-3,o=G.owner[r.id],fresh=G.lastClaim&&G.lastClaim.rid===r.id&&Date.now()-G.lastClaim.at<900;
  const op=o===null&&!free(r,human())?.22:1,h=Math.min(cl*36/64,15);
  let s=`<g class="route${o!==null?" owned":""}" data-rid="${r.id}" opacity="${op}"><title>${r.a} – ${r.b}: ${r.len} ${r.color}${o!==null?" (claimed by "+G.players[o].name+")":""}</title>`+
    `<line x1="${x1+ox}" y1="${y1+oy}" x2="${x2+ox}" y2="${y2+oy}" stroke="transparent" stroke-width="14"/>`;
  for(let k=0;k<r.len;k++){const t=pad+seg*(k+.5),tr=`translate(${(x1+ox+ux*t).toFixed(1)} ${(y1+oy+uy*t).toFixed(1)}) rotate(${ang})`;
    const slot=`<rect x="${(-cl/2).toFixed(1)}" y="-4" width="${cl.toFixed(1)}" height="8" rx="2" fill="${HEX[r.color]}" stroke="${r.color==="white"?"#9aa3ae":"#00000033"}" stroke-width="1.2"${o!==null?' opacity=".35"':""}/>`;
    s+=`<g transform="${tr}">${slot}${o===null?"":`<g class="${fresh?"fresh":""}" style="color:${PCOL[o]};animation-delay:${k*70}ms"><use href="#${k===0?"loco":"car"}" x="${(-cl/2).toFixed(1)}" y="${(-h/2-2).toFixed(1)}" width="${cl.toFixed(1)}" height="${h.toFixed(1)}" preserveAspectRatio="none" filter="url(#carshadow)"/></g>`}</g>`}
  return s+"</g>"}

function render(){if(SIM||!G)return;const me=human(),myTurn=cur()===me&&!G.over&&!G.pending;
  $("routes").innerHTML=ROUTES.map(routeSVG).join("");
  const goals=new Set();me.tickets.forEach(t=>{const T=TICKETS[t];if(!connected(me,T.a,T.b)){goals.add(T.a);goals.add(T.b)}});
  document.querySelectorAll(".city").forEach(g=>g.classList.toggle("goal",goals.has(g.dataset.city)));
  $("players").innerHTML=G.players.map(p=>`<div class="player ${p===cur()&&!G.over?"active":""}" style="--pc:${p.color}"><span class="dot"></span>
    <div class="pname">${p.name}<div class="sub">${p.bot?LEVELS[p.level]+" bot":p===me?"You":"Online"}</div></div>
    <div class="stats">${p.trains} trains · ${cardCount(p)} cards<br>${p.tickets.length} tickets · longest ${longest(p)}</div><div class="score">${p.score}</div></div>`).join("");
  $("market").innerHTML=G.faceUp.map((c,i)=>c?`<div class="tcard c-${c} ${!myTurn||(c==="wild"&&G.drawn)?"disabled":""}" data-i="${i}" title="${c}">${card(c,c==="wild"?`<span class="lbl">WILD</span>`:"")}</div>`:`<div class="tcard empty"></div>`).join("")+
    `<div class="tcard deck ${!myTurn||!(G.deck.length||G.discard.length)?"disabled":""}" data-i="deck" title="Draw from deck"><small>DECK</small>${G.deck.length+G.discard.length}</div>`;
  $("ticketBtn").disabled=!myTurn||G.drawn>0||!G.tdeck.length;
  $("hand").innerHTML=[...COLORS,"wild"].map(c=>`<div class="tcard c-${c} ${me.hand[c]?"":"zero"}" title="${c}">${card(c,`<span class="n">${me.hand[c]}</span>`)}</div>`).join("");
  $("tickets").innerHTML=me.tickets.map(t=>{const T=TICKETS[t];return ticketHTML(t,connected(me,T.a,T.b)?"done":"")}).join("")||`<span class="sub">None yet</span>`;
  const stuck=myTurn&&!G.drawn&&!canDrawAny()&&!G.tdeck.length&&!ROUTES.some(r=>routeOk(r,me)&&payOptions(r,me).length);
  $("status").innerHTML=(G.over?"Game over":G.pending?(G.pending.p===ME?"Choose your destination tickets":`${G.players[G.pending.p].name} is choosing tickets…`):
    myTurn?(G.drawn?"Draw one more card (not a face-up wild)":"Your turn: draw 2 cards, claim a route, or draw tickets"):`${cur().name} is playing…`)+
    (stuck?` <button class="ghost" id="passBtn">Pass</button>`:"")+(G.finalLeft>0&&!G.over?`<span class="final">Final round</span>`:"");
  if(stuck)$("passBtn").onclick=()=>act("pass");
  $("log").innerHTML=G.log.map(m=>`<div>${m}</div>`).join("");save();broadcast()}

function showTickets(){const pd=G.pending,sel=new Set(pd.offered);ticketsOpen=true;
  const draw=()=>{ov(`<h2>${pd.initial?"Choose your destinations":"New destination tickets"}</h2>
    <p class="muted">Keep at least ${pd.min}.${pd.initial?' One is a <b>long route</b>: if you skip it, it leaves the game.':''} Connect both cities with your own routes by game end to score the points, or lose them.</p>
    ${pd.offered.map(t=>ticketHTML(t,"big"+(sel.has(t)?" sel":""))).join("")}
    <button class="primary wide" id="keepBtn" ${sel.size<pd.min?"disabled":""}>Keep ${sel.size}</button>`);
    overlay.querySelectorAll("[data-t]").forEach(el=>{const t=+el.dataset.t;el.onclick=()=>{sel.has(t)?sel.delete(t):sel.add(t);draw();hl(t)};
      el.onmouseenter=()=>hl(t);el.onmouseleave=()=>hl(null)});
    $("keepBtn").onclick=()=>{closeOv();hl(null);ticketsOpen=false;act("keepTickets",pd.offered.filter(t=>sel.has(t)))}};
  draw()}
function showEnd(){const R=G.results;
  ov(`<h2>${R[0].p.i===ME?"You win!":R[0].p.name+" wins"}</h2>
    <table><tr><th>Player</th><th>Routes</th><th>Tickets</th><th>Longest</th><th>Total</th></tr>
    ${R.map(r=>`<tr><td><span class="dot" style="--pc:${r.p.color};display:inline-block;margin-right:6px"></span>${r.p.name}</td><td>${r.routes}</td>
      <td>+${r.plus} / −${r.minus}</td><td>${r.long}${r.bonus?" (+10)":""}</td><td><b>${r.total}</b></td></tr>`).join("")}</table>
    <div class="row"><button class="ghost wide" id="viewBtn">View board</button><button class="primary wide" id="againBtn">New game</button></div>`);
  $("viewBtn").onclick=closeOv;$("againBtn").onclick=showSetup}
function showSetup(){const sv=loadSave();
  ov(`<h2>Jade Rails</h2><p class="muted">Build rail lines across East Asia, Germany or France. Collect cards, claim routes, and connect your destination cities before the trains run out.</p>
    ${sv?`<button class="primary wide" id="resumeBtn" style="margin-bottom:6px">Resume saved game</button>
    <p class="sub" style="text-align:center;margin:0 0 14px">${sv.players.map(p=>`${p.name} ${p.score}`).join(" · ")} · ${sv.players[0].trains} trains left</p>
    <h3>Or start a new game</h3>`:""}
    <div class="row"><label for="mp">Map</label><select id="mp">${Object.values(MAPS).map(m=>`<option value="${m.id}" ${m===MAP?"selected":""}>${m.name}</option>`).join("")}</select></div>
    <div class="row"><label for="nm">Your name</label><input id="nm" value="You" maxlength="12"></div>
    ${botRows(true)}
    <button class="primary wide" id="startBtn">Start game</button>
    <h3 style="margin-top:16px">Play online with friends</h3>
    <div class="row"><button class="ghost wide" id="hostBtn">Host a room</button></div>
    <div class="row"><input id="code" placeholder="Room code" maxlength="4" value="${ROOM}" style="flex:1;text-transform:uppercase"><button class="ghost" id="joinBtn">Join</button></div>`);
  if(sv)$("resumeBtn").onclick=()=>{leaveNet();resume(sv)};
  const myName=()=>{const n=clean($("nm").value);try{localStorage.setItem("jr-name",n)}catch{}return n};
  $("nm").value=(()=>{try{return localStorage.getItem("jr-name")}catch{}})()||"You";
  $("startBtn").onclick=()=>{const bots=pickBots();
    if(!bots.length)return toast("Pick at least one opponent.");leaveNet();closeOv();newGame([{name:myName(),bot:false},...bots],$("mp").value)};
  const online=f=>()=>{const n=myName();if(n==="You")return toast("Type your name first.");f(n)};
  $("hostBtn").onclick=online(n=>hostRoom(n,$("mp").value));
  $("joinBtn").onclick=online(n=>{const c=$("code").value.trim().toUpperCase();c.length===4?joinRoom(c,n):toast("Enter the 4-letter room code.")})}
const botRows=on=>BOT_NAMES.map((n,i)=>`<div class="row"><label for="b${i}">${n}</label><select id="b${i}"><option value="-1">Not playing</option>${LEVELS.map((l,j)=>`<option value="${j}" ${on&&j===1?"selected":""}>${l}</option>`).join("")}</select></div>`).join("");
const pickBots=()=>BOT_NAMES.map((n,i)=>({name:n,bot:true,level:+$("b"+i).value})).filter(b=>b.level>=0);
const clean=s=>String(s||"").replace(/[<>&"']/g,"").trim().slice(0,12)||"You"; // names from other players end up in innerHTML

$("map").addEventListener("click",e=>{if(panMoved)return;const g=e.target.closest("[data-rid]");if(!g||!G)return;const r=ROUTES[+g.dataset.rid],me=human();
  if(G.over||cur()!==me||G.pending)return nope("Wait for your turn.");
  if(G.drawn)return nope("You already drew a card: draw one more.");
  if(!free(r,me))return nope("That route isn't available.");
  if(me.trains<r.len)return nope("Not enough trains left.");
  const o=payOptions(r,me);if(!o.length)return nope(`Need ${r.len} ${r.color==="gray"?"cards of one color":r.color+" cards"} (wilds count).`);
  if(o.length===1)return act("claim",r.id,o[0]);
  ov(`<h2>Pay for ${r.a} – ${r.b}</h2><p class="muted">${r.len} cards, worth ${PTS[r.len]} points.</p><div class="payopts">${o.map(c=>{const n=c==="wild"?0:Math.min(me.hand[c],r.len),w=r.len-n;
    return`<button data-c="${c}"><span class="chip c-${c}"></span>${[n?n+" "+c:"",w?w+" wild":""].filter(Boolean).join(" + ")}</button>`}).join("")}</div>
    <button class="ghost wide" id="cancelPay">Cancel</button>`);
  overlay.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{closeOv();act("claim",r.id,b.dataset.c)});$("cancelPay").onclick=closeOv});
$("market").addEventListener("click",e=>{const el=e.target.closest("[data-i]");if(!el||el.classList.contains("disabled"))return;
  el.dataset.i==="deck"?act("takeDeck"):act("takeFace",+el.dataset.i)});
$("ticketBtn").onclick=()=>act("drawTickets");
$("newBtn").onclick=showSetup;
const muteLabel=()=>$("muteBtn").textContent=muted?"🔇":"🔊";muteLabel();
$("muteBtn").onclick=()=>{muted=!muted;try{localStorage.setItem("jr-muted",muted?"1":"0")}catch{}muteLabel();sfx("card")};
$("tickets").addEventListener("mouseover",e=>{const t=e.target.closest("[data-t]");hl(t?+t.dataset.t:null)});
$("tickets").addEventListener("mouseleave",()=>hl(null));
useMap(loadSave()?.map||"asia");showSetup();
</script>
</body>
</html>
